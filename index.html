<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StödGuiden</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#17324d}
header{text-align:center;padding:24px 18px 12px;background:white}
.logo{font-size:34px;font-weight:800;color:#24589b}
.logo::before{content:"◉ ";font-size:24px}
.subtitle{font-size:18px;margin:8px 0 18px}
.langbar{display:flex;justify-content:center;gap:10px}
.langbar button{border:1px solid #ccd5df;border-radius:28px;padding:11px 22px;background:white;font-size:17px;cursor:pointer}
.langbar button.active{background:#2f61aa;color:white;border-color:#2f61aa}
main{max-width:720px;margin:auto;padding:18px}
h1{text-align:center;font-size:30px;margin:25px 0}
.cards{display:grid;gap:14px}
.card{width:100%;border:0;border-radius:24px;padding:19px 22px;background:#2f61aa;color:white;text-align:left;font-size:21px;font-weight:700;cursor:pointer;box-shadow:0 3px 8px #0002}
.card:active{transform:scale(.99)}
.screen{display:none;background:white;border-radius:20px;padding:22px;margin-top:20px;box-shadow:0 2px 10px #0001}
.screen.active{display:block}
.back{border:0;background:#e8eef6;color:#17324d;border-radius:14px;padding:10px 16px;font-size:16px;cursor:pointer}
.option{display:block;width:100%;margin:12px 0;padding:15px;border:1px solid #ccd5df;border-radius:14px;background:#fff;text-align:left;font-size:17px;cursor:pointer}
.result{margin-top:18px;padding:18px;background:#eef5ff;border-left:5px solid #2f61aa;border-radius:12px}
a{color:#175da8}
.small{font-size:14px;color:#5c6b79}
ul{padding-left:22px}
</style>
</head>
<body>
<header>
  <div class="logo" data-i18n="title">StödGuiden</div>
  <div class="subtitle" data-i18n="subtitle">Hitta el apoyo adecuado para ti y tu familia.</div>
  <div class="langbar">
    <button id="svBtn" onclick="setLang('sv')">🇸🇪 Svenska</button>
    <button id="esBtn" class="active" onclick="setLang('es')">🇪🇸 Español</button>
  </div>
</header>

<main>
<section id="home" class="screen active">
<h1 data-i18n="question">¿Qué necesitas ayuda con?</h1>
<div class="cards">
<button class="card" data-card="unknown" data-i18n="unknown">🔎 No sé qué ayudas puedo solicitar</button>
<button class="card" data-card="child" data-i18n="child">👧 Ayudas para mi hijo</button>
<button class="card" data-card="assist" data-i18n="assist">♿ Personlig assistans</button>
<button class="card" data-card="lss" data-i18n="lss">📋 LSS</button>
<button class="card" data-card="transport" data-i18n="transport">🚕 Färdtjänst</button>
<button class="card" data-card="school" data-i18n="school">🏫 Escuela</button>
<button class="card" data-card="housing" data-i18n="housing">🏠 Vivienda</button>
<button class="card" data-card="rejected" data-i18n="rejected">❓ Me han rechazado una ayuda</button>
</div>
</section>

<section id="detail" class="screen">
<button class="back" onclick="goHome()" data-i18n="back">← Volver</button>
<div id="detailContent"></div>
</section>
</main>

<script>
/* ===== CUESTIONARIO ===== */
(function(){
const s=document.createElement("style");
s.textContent=`#helpQuiz{display:none;position:fixed;inset:0;z-index:10000;background:#f5f7fb;overflow:auto;padding:18px}#helpQuizCard{max-width:720px;margin:10px auto;background:white;border-radius:22px;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.14)}.quizOption{display:block;width:100%;padding:14px;margin:9px 0;border:1px solid #d2dbe5;border-radius:13px;background:white;text-align:left;font-size:16px;cursor:pointer}.quizOption.selected{background:#eef4ff;border-color:#2f61aa}.quizBack{width:100%;padding:13px;border:0;border-radius:13px;background:#e8eef6;color:#173b63;font-weight:700;margin-top:10px}.quizResult{background:#eef4ff;border-radius:16px;padding:15px;margin:12px 0;line-height:1.5}.quizNote{background:#fff5d9;border-radius:14px;padding:13px;line-height:1.45;margin-top:15px;font-size:14px}`;
document.head.appendChild(s);

const q=document.createElement("div");
q.id="helpQuiz";
q.innerHTML='<div id="helpQuizCard"><div id="quizContent"></div></div>';
document.body.appendChild(q);

const state={person:null,needs:[],night:false,current:null};

function es(){return lang==="es"}
function render(html){document.getElementById("quizContent").innerHTML=html}
function open(){q.style.display="block";start()}
function close(){q.style.display="none"}

function start(){
 state.person=null;state.needs=[];state.night=false;state.current=null;
 render(`<h2>${es()?"🔎 Buscar posibles ayudas":"🔎 Hitta möjliga stöd"}</h2>
 <p>${es()?"Responde a unas preguntas y te mostraremos áreas de apoyo que puede valer la pena investigar.":"Svara på några frågor så visar vi stödområden som kan vara värda att undersöka."}</p>
 <strong>${es()?"1. ¿Para quién buscas ayuda?":"1. Vem söker du stöd för?"}</strong>
 <button class="quizOption" onclick="stqPerson('child')">👧 ${es()?"Mi hijo/a":"Mitt barn"}</button>
 <button class="quizOption" onclick="stqPerson('adult')">👤 ${es()?"Para mí / un adulto":"För mig / en vuxen"}</button>
 <button class="quizOption" onclick="stqPerson('family')">👨‍👩‍👧 ${es()?"Para mi familia":"För min familj"}</button>
 <button class="quizBack" onclick="closeStq()">← ${es()?"Cerrar":"Stäng"}</button>`);
}

window.stqPerson=function(p){
 state.person=p;
 render(`<h2>${es()?"2. ¿Qué necesitas principalmente?":"2. Vad behöver du främst hjälp med?"}</h2>
 <p>${es()?"Puedes elegir varias opciones.":"Du kan välja flera alternativ."}</p>
 ${[
 ["daily",es()?"🤝 Ayuda en la vida diaria":"🤝 Stöd i vardagen"],
 ["school",es()?"🏫 Escuela / educación":"🏫 Skola / utbildning"],
 ["transport",es()?"🚕 Transporte":"🚕 Transport"],
 ["night",es()?"🌙 Ayuda o supervisión por la noche":"🌙 Hjälp eller tillsyn på natten"],
 ["money",es()?"💰 Economía / prestaciones":"💰 Ekonomi / ersättningar"],
 ["housing",es()?"🏠 Vivienda":"🏠 Boende"]
 ].map(x=>`<button class="quizOption" onclick="stqToggle('${x[0]}',this)">${x[1]}</button>`).join("")}
 <button class="quizOption" onclick="stqNext()">➡️ ${es()?"Continuar":"Fortsätt"}</button>
 <button class="quizBack" onclick="start()">← ${es()?"Atrás":"Tillbaka"}</button>`);
};

window.stqToggle=function(n,b){
 if(n==="night"){state.night=!state.night;b.classList.toggle("selected",state.night);return}
 const i=state.needs.indexOf(n);
 if(i>=0){state.needs.splice(i,1);b.classList.remove("selected")}
 else{state.needs.push(n);b.classList.add("selected")}
};

window.stqNext=function(){
 if(!state.needs.length && !state.night){
   render(`<h3>ℹ️ ${es()?"Selecciona al menos una necesidad":"Välj minst ett behov"}</h3>
   <button class="quizBack" onclick="stqPerson('${state.person}')">← ${es()?"Volver":"Tillbaka"}</button>`);
   return;
 }
 render(`<h2>${es()?"3. ¿Cuál es tu situación actual?":"3. Vilken situation har du nu?"}</h2>
 <button class="quizOption" onclick="stqCurrent('more')">➕ ${es()?"Ya recibo alguna ayuda y necesito más":"Jag har redan stöd men behöver mer"}</button>
 <button class="quizOption" onclick="stqCurrent('waiting')">⏳ ${es()?"Estoy esperando una decisión":"Jag väntar på ett beslut"}</button>
 <button class="quizOption" onclick="stqCurrent('rejected')">❌ ${es()?"Me han rechazado una ayuda":"Jag har fått avslag på ett stöd"}</button>
 <button class="quizOption" onclick="stqCurrent('none')">📝 ${es()?"Todavía no he solicitado ninguna ayuda":"Jag har ännu inte ansökt om stöd"}</button>
 <button class="quizBack" onclick="stqPerson('${state.person}')">← ${es()?"Atrás":"Tillbaka"}</button>`);
};

window.stqCurrent=function(c){
 state.current=c;
 const result={};
 const add=(key,title,body)=>{if(!result[key])result[key]=[title,body]};

 if(state.needs.includes("daily")){
   add("assist",es()?"♿ Personlig assistans":"♿ Personlig assistans",
     es()?"Puede ser relevante investigar asistencia personal y otras medidas de apoyo cuando existen necesidades personales importantes.":"Det kan vara relevant att undersöka personlig assistans och andra stödinsatser när det finns omfattande personliga behov.");
   add("lss",es()?"📋 LSS":"📋 LSS",
     es()?"Investiga qué insatser de LSS pueden corresponder a la situación.":"Undersök vilka LSS-insatser som kan vara aktuella.");
 }
 if(state.needs.includes("school")){
   add("school",es()?"🏫 Escuela":"🏫 Skola",
     es()?"Puede ser útil hablar con la escuela sobre adaptaciones, apoyo especial y las necesidades del alumno.":"Det kan vara bra att prata med skolan om anpassningar, särskilt stöd och elevens behov.");
 }
 if(state.needs.includes("transport")){
   add("transport",es()?"🚕 Färdtjänst":"🚕 Färdtjänst",
     es()?"Comprueba si Färdtjänst puede ser una vía adecuada y revisa los requisitos aplicables.":"Kontrollera om färdtjänst kan vara aktuell och vilka krav som gäller.");
 }
 if(state.needs.includes("money")){
   add("money",es()?"💰 Försäkringskassan":"💰 Försäkringskassan",
     es()?"Comprueba qué prestaciones pueden ser relevantes para tu situación.":"Undersök vilka ersättningar som kan vara aktuella för din situation.");
 }
 if(state.needs.includes("housing")){
   add("housing",es()?"🏠 Vivienda":"🏠 Boende",
     es()?"Investiga apoyo relacionado con vivienda o adaptación de la vivienda cuando corresponda.":"Undersök stöd för boende eller bostadsanpassning när det är aktuellt.");
 }
 if(state.night){
   add("night",es()?"🌙 Necesidades durante la noche":"🌙 Behov på natten",
     es()?"Anota con qué frecuencia se despierta la persona, qué ayuda necesita y cuánto dura cada episodio. Esa información puede ser útil al explicar las necesidades de apoyo.":"Anteckna hur ofta personen vaknar, vilken hjälp som behövs och hur länge varje episod varar. Det kan vara viktigt när stödbehovet ska beskrivas.");
 }
 if(state.current==="rejected"){
   add("rejected",es()?"❌ Ayuda rechazada":"❌ Avslag på stöd",
     es()?"Revisa la resolución, los motivos y el plazo indicado para omprövning o överklagande.":"Läs beslutet noggrant, kontrollera skälen och tidsfristen för omprövning eller överklagande.");
 }
 if(state.current==="more"){
   add("more",es()?"➕ Necesitas más apoyo":"➕ Du behöver mer stöd",
     es()?"Como ya recibes apoyo, reúne ejemplos concretos de las necesidades que no están cubiertas y cuándo aparecen.":"Eftersom du redan har stöd, samla konkreta exempel på behov som inte täcks och när de uppstår.");
 }
 if(state.current==="waiting"){
   add("waiting",es()?"⏳ Esperando una decisión":"⏳ Väntar på beslut",
     es()?"Guarda la solicitud y la documentación enviada y anota la fecha de contacto o solicitud.":"Spara ansökan och inskickade handlingar och anteckna datum för kontakt eller ansökan.");
 }

 const vals=Object.values(result);
 const links={
  assist:"https://www.forsakringskassan.se/privatperson/vuxen-med-funktionsnedsattning/assistansersattning/sa-beraknas-grundlaggande-behov",
  lss:"https://goteborg.se/",
  school:"https://www.skolverket.se/",
  transport:"https://goteborg.se/",
  money:"https://www.forsakringskassan.se/",
  housing:"https://www.boverket.se/",
  rejected:"https://www.forsakringskassan.se/"
 };
 const official={
  assist:es()
   ?"Comprueba especialmente si la necesidad se refiere a higiene personal, comidas, vestirse/desvestirse, comunicación, prevención de daños por una discapacidad psíquica o apoyo continuo por una condición médica."
   :"Kontrollera särskilt om behovet gäller personlig hygien, måltider, av- och påklädning, kommunikation, stöd för att förebygga skada eller löpande stöd på grund av ett medicinskt tillstånd.",
  lss:es()
   ?"Comprueba qué insats de LSS puede ser relevante y quién la tramita en tu municipio."
   :"Kontrollera vilken LSS-insats som kan vara aktuell och vem som handlägger den i din kommun.",
  school:es()
   ?"Pregunta por extra anpassningar y, cuando proceda, särskilt stöd y åtgärdsprogram."
   :"Fråga om extra anpassningar och, när det är aktuellt, särskilt stöd och åtgärdsprogram.",
  transport:es()
   ?"Comprueba los requisitos de Färdtjänst de tu municipio o región antes de solicitarla."
   :"Kontrollera kraven för färdtjänst i din kommun eller region innan du ansöker.",
  money:es()
   ?"Revisa las prestaciones de Försäkringskassan que correspondan a la situación concreta."
   :"Undersök vilka ersättningar från Försäkringskassan som kan vara aktuella i den konkreta situationen.",
  housing:es()
   ?"Comprueba si una discapacidad hace necesaria una adaptación de la vivienda y qué requisitos tiene el bostadsanpassningsbidrag."
   :"Kontrollera om en funktionsnedsättning gör bostadsanpassning nödvändig och vilka krav som gäller för bostadsanpassningsbidrag.",
  rejected:es()
   ?"Lee la resolución, los motivos y el plazo para pedir omprövning o överklaga."
   :"Läs beslutet, skälen och tidsfristen för omprövning eller överklagande."
 };
 const nextEs={
  assist:"Siguiente paso: describe ejemplos concretos de la ayuda necesaria, con frecuencia y duración, y comprueba la información oficial.",
  lss:"Siguiente paso: comprueba qué insats de LSS puede corresponder y quién tramita la solicitud.",
  school:"Siguiente paso: habla con la escuela y pide que las necesidades y medidas de apoyo queden documentadas.",
  transport:"Siguiente paso: comprueba los requisitos de Färdtjänst y cómo se solicita en tu municipio/región.",
  money:"Siguiente paso: revisa las prestaciones de Försäkringskassan relacionadas con tu situación.",
  housing:"Siguiente paso: describe qué problema existe en la vivienda y qué adaptación se necesita.",
  rejected:"Siguiente paso: revisa la resolución, los motivos y el plazo para omprövning/överklagande."
 };
 const nextSv={
  assist:"Nästa steg: beskriv konkreta hjälpbehov, hur ofta de uppstår och hur länge hjälpen behövs, och kontrollera officiell information.",
  lss:"Nästa steg: kontrollera vilken LSS-insats som kan vara aktuell och vem som handlägger ansökan.",
  school:"Nästa steg: prata med skolan och be att behoven och stödåtgärderna dokumenteras.",
  transport:"Nästa steg: kontrollera kraven för färdtjänst och hur ansökan görs i din kommun/region.",
  money:"Nästa steg: undersök Försäkringskassans ersättningar som kan vara relevanta för din situation.",
  housing:"Nästa steg: beskriv problemet i bostaden och vilken anpassning som behövs.",
  rejected:"Nästa steg: gå igenom beslutet, skälen och tidsfristen för omprövning/överklagande."
 };
 const keys=Object.keys(result);
 render(`<h2>⭐ ${es()?"Orientación inicial":"Första vägledning"}</h2>
 <p>${es()?"Según tus respuestas, estas son las áreas que merece la pena investigar primero:":"Utifrån dina svar är detta områden som kan vara värda att undersöka först:"}</p>
 ${vals.map((x,i)=>{const k=keys[i];const next=es()?nextEs[k]:nextSv[k];return `<div class="quizResult"><strong>${x[0]}</strong><br>${x[1]}<br><br><strong>${es()?"Qué comprobar:":"Vad du bör kontrollera:"}</strong> ${official[k]||""}<br><br><strong>${es()?"Qué hacer ahora:":"Vad du kan göra nu:"}</strong> ${next}<br><br><a href="${links[k]||"https://www.forsakringskassan.se/"}" target="_blank" rel="noopener">${es()?"Ver información oficial →":"Se officiell information →"}</a></div>`}).join("")}
 <div class="quizNote">ℹ️ ${es()?"Resultado orientativo. No determina si tienes derecho a una ayuda concreta. Comprueba siempre los requisitos oficiales.":"Detta är generell vägledning och avgör inte om du har rätt till en viss insats. Kontrollera alltid de officiella kraven."}</div>
 <button class="quizOption" onclick="start()">🔄 ${es()?"Nueva búsqueda":"Ny sökning"}</button>
 <button class="quizBack" onclick="closeStq()">← ${es()?"Cerrar":"Stäng"}</button>`);
};

window.closeStq=close;

/* El botón principal de "no sé qué ayudas..." abre directamente el cuestionario. */
document.querySelectorAll('[data-card="unknown"]').forEach(function(btn){
 btn.addEventListener("click",function(e){e.preventDefault();open()});
});
})();

const T={
es:{
title:"StödGuiden",subtitle:"Halla el apoyo adecuado para ti y tu familia.",
question:"¿Qué necesitas ayuda con?",back:"← Volver",
unknown:"🔎 No sé qué ayudas puedo solicitar",child:"👧 Ayudas para mi hijo",assist:"♿ Personlig assistans",lss:"📋 LSS",transport:"🚕 Färdtjänst",school:"🏫 Escuela",housing:"🏠 Vivienda",rejected:"❓ Me han rechazado una ayuda",
titles:{
unknown:"Encontrar qué ayudas puedes solicitar",child:"Ayudas para tu hijo",assist:"Personlig assistans",lss:"LSS",transport:"Färdtjänst",school:"Escuela",housing:"Vivienda",rejected:"¿Te han rechazado una ayuda?"
},
body:{
unknown:`<p>Si no sabes por dónde empezar, estas son algunas áreas que pueden ser relevantes para una familia en Suecia:</p><ul><li>Försäkringskassan y ayudas económicas</li><li>Personlig assistans</li><li>LSS y apoyo municipal</li><li>Färdtjänst</li><li>Apoyo escolar y adaptación educativa</li><li>Ayudas relacionadas con vivienda</li></ul><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a> · <a href="https://www.goteborg.se/" target="_blank">Göteborgs Stad</a></p>`,
child:`<p>Si tu hijo tiene una discapacidad o necesita mucho apoyo, hay varias áreas que conviene revisar. No hace falta tener una prestación previa para investigarlas.</p>
<ul>
<li><strong>Omvårdnadsbidrag</strong>: para padres cuyo hijo necesita una atención y supervisión adicionales por su discapacidad.</li>
<li><strong>Merkostnadsersättning</strong>: para costes adicionales que la familia paga debido a la discapacidad del niño.</li>
<li><strong>Personlig assistans / assistansersättning</strong>: cuando existen necesidades importantes de ayuda personal y se cumplen los requisitos aplicables.</li>
<li><strong>LSS</strong>: distintas medidas de apoyo que pueden ser relevantes según la situación.</li>
<li><strong>Färdtjänst</strong>: si el niño tiene grandes dificultades para desplazarse con el transporte público ordinario y cumple los requisitos.</li>
<li><strong>Escuela</strong>: adaptaciones y apoyo especial según las necesidades educativas.</li>
</ul>
<p><a href="https://www.forsakringskassan.se/privatperson/familj-och-barn/barn-med-funktionsnedsattning-eller-behov-av-extra-stod" target="_blank">Ver ayudas de Försäkringskassan para niños →</a></p>
<p><a href="https://www.skolverket.se/" target="_blank">Ver información de Skolverket →</a></p>`,
assist:`<p><strong>Personlig assistans</strong> puede ser relevante cuando existe una necesidad importante y duradera de ayuda personal.</p>
<ul>
<li><strong>Necesidades básicas:</strong> respiración, higiene personal, comidas, vestirse/desvestirse, comunicación y determinados apoyos para prevenir daños o relacionados de forma continua con una condición médica.</li>
<li><strong>Más de 20 horas:</strong> si las necesidades básicas superan en promedio 20 horas por semana, Försäkringskassan puede ser la autoridad que valore la assistansersättning; con menos de 20 horas, se debe contactar con el municipio.</li>
<li><strong>En niños:</strong> existe además un ajuste por la ayuda que normalmente corresponde a los padres según la edad del niño.</li>
<li><strong>Documentación:</strong> conviene describir qué ayuda se necesita, cómo se realiza, con qué frecuencia y cuánto tiempo dura.</li>
</ul>
<p><a href="https://www.forsakringskassan.se/privatperson/vuxen-med-funktionsnedsattning/assistansersattning/assistansersattning-for-barn" target="_blank">Försäkringskassan – asistencia para niños →</a></p>
<p><a href="https://www.forsakringskassan.se/privatperson/vuxen-med-funktionsnedsattning/assistansersattning/sa-beraknas-grundlaggande-behov" target="_blank">Ver necesidades básicas →</a></p>
<p><a href="https://goteborg.se/wps/portal?uri=gbglnk%3Agbg.page.e2e5298e-3757-498e-9187-53955e910f15" target="_blank">Göteborgs Stad – Personlig assistans →</a></p>`,
lss:`<p>LSS es una ley sueca que permite determinadas medidas de apoyo para personas con discapacidad.</p><ul><li>Personlig assistans</li><li>Kontaktperson</li><li>Ledsagarservice</li><li>Korttidsvistelse</li><li>Avlösarservice</li></ul><p><a href="https://www.1177.se/" target="_blank">1177</a> · <a href="https://www.goteborg.se/" target="_blank">Göteborgs Stad</a></p>`,
transport:`<p>Färdtjänst puede ser una alternativa cuando una discapacidad hace difícil utilizar el transporte público.</p><p>En Göteborg puedes consultar las condiciones y solicitar información a través de la ciudad.</p><p><a href="https://goteborg.se/" target="_blank">Göteborgs Stad</a></p>`,
school:`<p>Si tu hijo necesita adaptaciones o un entorno escolar diferente, puedes solicitar una evaluación de sus necesidades y hablar con la escuela y el municipio.</p><ul><li>Extra anpassningar</li><li>Särskilt stöd</li><li>Åtgärdsprogram</li><li>Cambio de escuela cuando proceda</li></ul><p><a href="https://www.skolverket.se/" target="_blank">Skolverket</a></p>`,
housing:`<p>Según la situación, puede existir apoyo relacionado con vivienda, adaptación de la vivienda o economía familiar.</p><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a> · <a href="https://www.boverket.se/" target="_blank">Boverket</a></p>`,
rejected:`<p>Si te han rechazado una ayuda, revisa primero la resolución escrita. Normalmente indicará los motivos y qué plazo existe para recurrir.</p><p><strong>No dejes pasar el plazo.</strong> Guarda la resolución y todos los documentos.</p><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a> · <a href="https://www.domstol.se/" target="_blank">Sveriges Domstolar</a></p>`
}},

body:{
unknown:`<p>Om du inte vet var du ska börja kan flera stödområden vara aktuella:</p><ul><li>Försäkringskassan och ekonomiskt stöd</li><li>Personlig assistans</li><li>Insatser enligt LSS</li><li>Färdtjänst</li><li>Skolans stöd och anpassningar</li><li>Stöd kopplat till boende</li></ul><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a> · <a href="https://www.goteborg.se/" target="_blank">Göteborgs Stad</a></p>`,
child:`<p>Om ditt barn har en funktionsnedsättning eller behöver mycket stöd finns flera områden som kan vara värda att kontrollera. Du behöver inte redan ha en beviljad insats för att undersöka dem.</p>
<ul>
<li><strong>Omvårdnadsbidrag</strong>: för föräldrar vars barn behöver extra omvårdnad och tillsyn på grund av en funktionsnedsättning.</li>
<li><strong>Merkostnadsersättning</strong>: för extra kostnader som familjen själv betalar på grund av barnets funktionsnedsättning.</li>
<li><strong>Personlig assistans / assistansersättning</strong>: när det finns omfattande behov av personlig hjälp och kraven är uppfyllda.</li>
<li><strong>LSS</strong>: olika stödinsatser som kan vara aktuella beroende på situationen.</li>
<li><strong>Färdtjänst</strong>: om barnet har stora svårigheter att resa med vanlig kollektivtrafik och kraven är uppfyllda.</li>
<li><strong>Skola</strong>: anpassningar och särskilt stöd utifrån elevens behov.</li>
</ul>
<p><a href="https://www.forsakringskassan.se/privatperson/familj-och-barn/barn-med-funktionsnedsattning-eller-behov-av-extra-stod" target="_blank">Se Försäkringskassans stöd för barn →</a></p>
<p><a href="https://www.skolverket.se/" target="_blank">Se information från Skolverket →</a></p>`,
assist:`<p><strong>Personlig assistans</strong> kan vara aktuell när det finns omfattande och varaktiga behov av personlig hjälp.</p>
<ul>
<li><strong>Grundläggande behov:</strong> andning, personlig hygien, måltider, av- och påklädning, kommunikation samt vissa stöd för att förebygga skada eller som behöver ges löpande på grund av ett medicinskt tillstånd.</li>
<li><strong>Mer än 20 timmar:</strong> om de grundläggande behoven i genomsnitt överstiger 20 timmar per vecka kan Försäkringskassan bedöma rätten till assistansersättning; vid mindre än 20 timmar ska du vända dig till kommunen.</li>
<li><strong>Barn:</strong> ett föräldraavdrag görs för den hjälp som en vårdnadshavare normalt ska ge utifrån barnets ålder och situation.</li>
<li><strong>Dokumentation:</strong> beskriv vilken hjälp som behövs, hur den ges, hur ofta och hur lång tid den tar.</li>
</ul>
<p><a href="https://www.forsakringskassan.se/privatperson/vuxen-med-funktionsnedsattning/assistansersattning/assistansersattning-for-barn" target="_blank">Försäkringskassan – assistans för barn →</a></p>
<p><a href="https://www.forsakringskassan.se/privatperson/vuxen-med-funktionsnedsattning/assistansersattning/sa-beraknas-grundlaggande-behov" target="_blank">Se grundläggande behov →</a></p>
<p><a href="https://goteborg.se/wps/portal?uri=gbglnk%3Agbg.page.e2e5298e-3757-498e-9187-53955e910f15" target="_blank">Göteborgs Stad – Personlig assistans →</a></p>`,
lss:`<p>LSS är en lag som ger vissa personer med funktionsnedsättning rätt till särskilda stödinsatser.</p><ul><li>Personlig assistans</li><li>Kontaktperson</li><li>Ledsagarservice</li><li>Korttidsvistelse</li><li>Avlösarservice</li></ul><p><a href="https://www.1177.se/" target="_blank">1177</a> · <a href="https://www.goteborg.se/" target="_blank">Göteborgs Stad</a></p>`,
transport:`<p>Färdtjänst kan vara ett alternativ när en funktionsnedsättning gör det svårt att resa med kollektivtrafik.</p><p><a href="https://goteborg.se/" target="_blank">Göteborgs Stad</a></p>`,
school:`<p>Om ditt barn behöver anpassningar eller en annan skolmiljö kan du prata med skolan och kommunen om barnets stödbehov.</p><ul><li>Extra anpassningar</li><li>Särskilt stöd</li><li>Åtgärdsprogram</li><li>Skolbyte när det är aktuellt</li></ul><p><a href="https://www.skolverket.se/" target="_blank">Skolverket</a></p>`,
housing:`<p>Beroende på situation kan det finnas stöd för boende, bostadsanpassning eller familjens ekonomi.</p><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a> · <a href="https://www.boverket.se/" target="_blank">Boverket</a></p>`,
rejected:`<p>Om du har fått avslag på ett stöd ska du först läsa beslutet noggrant. Där står normalt skälen och vilken tid du har för att begära omprövning eller överklaga.</p><p><strong>Missa inte tidsfristen.</strong></p><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a> · <a href="https://www.domstol.se/" target="_blank">Sveriges Domstolar</a></p>`
}}

let lang='es';
function setLang(l){
 lang=l;
 document.documentElement.lang=l;
 document.querySelectorAll('[data-i18n]').forEach(e=>{let k=e.dataset.i18n;if(T[l][k])e.innerHTML=T[l][k]});
 document.getElementById('svBtn').classList.toggle('active',l==='sv');
 document.getElementById('esBtn').classList.toggle('active',l==='es');
 if(document.getElementById('detail').classList.contains('active') && window.currentCard) openCard(window.currentCard);
}
function openCard(k){
 window.currentCard=k;
 document.getElementById('home').classList.remove('active');
 document.getElementById('detail').classList.add('active');
 document.getElementById('detailContent').innerHTML='<h1>'+T[lang].titles[k]+'</h1><div class="result">'+T[lang].body[k]+'</div>';
 window.scrollTo(0,0);
}
function goHome(){
 document.getElementById('detail').classList.remove('active');
 document.getElementById('home').classList.add('active');
 window.scrollTo(0,0);
}
window.openCard = openCard;
window.goHome = goHome;

document.querySelectorAll('[data-card]').forEach(function(btn){
 btn.addEventListener('click', function(){
   openCard(btn.getAttribute('data-card'));
 });
});
