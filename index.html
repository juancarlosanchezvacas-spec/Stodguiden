<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StödGuiden</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#17324d}
header{text-align:center;padding:24px 18px 12px;background:white}
.logo{font-size:34px;font-weight:800;color:#24589b}
.logo::before{content:"◉ ";font-size:24px}
.subtitle{font-size:18px;margin:8px 0 18px}
.langbar{display:flex;justify-content:center;gap:10px}
.langbar button{border:1px solid #ccd5df;border-radius:28px;padding:11px 22px;background:white;font-size:17px;cursor:pointer}
.langbar button.active{background:#2f61aa;color:white;border-color:#2f61aa}
main{max-width:720px;margin:auto;padding:18px}
h1{text-align:center;font-size:30px;margin:25px 0}
.cards{display:grid;gap:14px}
.card{width:100%;border:0;border-radius:24px;padding:19px 22px;background:#2f61aa;color:white;text-align:left;font-size:21px;font-weight:700;cursor:pointer;box-shadow:0 3px 8px #0002}
.card:active{transform:scale(.99)}
.screen{display:none;background:white;border-radius:20px;padding:22px;margin-top:20px;box-shadow:0 2px 10px #0001}
.screen.active{display:block}
.back{border:0;background:#e8eef6;color:#17324d;border-radius:14px;padding:10px 16px;font-size:16px;cursor:pointer}
.option{display:block;width:100%;margin:12px 0;padding:15px;border:1px solid #ccd5df;border-radius:14px;background:#fff;text-align:left;font-size:17px;cursor:pointer}
.result{margin-top:18px;padding:18px;background:#eef5ff;border-left:5px solid #2f61aa;border-radius:12px}
a{color:#175da8}
.small{font-size:14px;color:#5c6b79}
ul{padding-left:22px}
</style>
</head>
<body>
<header>
  <div class="logo" data-i18n="title">StödGuiden</div>
  <div class="subtitle" data-i18n="subtitle">Hitta el apoyo adecuado para ti y tu familia.</div>
  <div class="langbar">
    <button id="svBtn" onclick="setLang('sv')">🇸🇪 Svenska</button>
    <button id="esBtn" class="active" onclick="setLang('es')">🇪🇸 Español</button>
  </div>
</header>

<main>
<section id="home" class="screen active">
<h1 data-i18n="question">¿Qué necesitas ayuda con?</h1>
<div class="cards">
<button class="card" onclick="openCard('unknown')" data-i18n="unknown">🔎 No sé qué ayudas puedo solicitar</button>
<button class="card" onclick="openCard('child')" data-i18n="child">👧 Ayudas para mi hijo</button>
<button class="card" onclick="openCard('assist')" data-i18n="assist">♿ Personlig assistans</button>
<button class="card" onclick="openCard('lss')" data-i18n="lss">📋 LSS</button>
<button class="card" onclick="openCard('transport')" data-i18n="transport">🚕 Färdtjänst</button>
<button class="card" onclick="openCard('school')" data-i18n="school">🏫 Escuela</button>
<button class="card" onclick="openCard('housing')" data-i18n="housing">🏠 Vivienda</button>
<button class="card" onclick="openCard('rejected')" data-i18n="rejected">❓ Me han rechazado una ayuda</button>
</div>
</section>

<section id="detail" class="screen">
<button class="back" onclick="goHome()" data-i18n="back">← Volver</button>
<div id="detailContent"></div>
</section>
</main>

<script>
/* ===== CUESTIONARIO COMPLETO ===== */
(function(){
const s=document.createElement("style");
s.textContent=`#helpQuizBtn{display:block;width:100%;margin:12px 0;padding:15px;border:0;border-radius:16px;background:#173b63;color:white;font-size:17px;font-weight:800;cursor:pointer}#helpQuiz{display:none;position:fixed;inset:0;z-index:10000;background:#f5f7fb;overflow:auto;padding:18px}#helpQuizCard{max-width:720px;margin:10px auto;background:white;border-radius:22px;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.14)}#helpQuizCard h2{color:#173b63;margin-top:0}.quizOption{display:block;width:100%;padding:14px;margin:9px 0;border:1px solid #d2dbe5;border-radius:13px;background:white;text-align:left;font-size:16px;cursor:pointer}.quizBack{width:100%;padding:13px;border:0;border-radius:13px;background:#e8eef6;color:#173b63;font-weight:700;margin-top:10px}.quizResult{background:#eef4ff;border-radius:16px;padding:15px;margin:12px 0;line-height:1.5}.quizResult a{display:inline-block;margin-top:8px;font-weight:700;color:#173b63}.quizDisclaimer{background:#fff5d9;border-radius:14px;padding:13px;line-height:1.45;margin-top:15px;font-size:14px}.quizProgress{font-size:13px;color:#65758a;margin-bottom:10px}`;
document.head.appendChild(s);

const b=document.createElement("button");
b.id="helpQuizBtn";
b.textContent="🔎 No sé qué ayudas puedo solicitar";

const q=document.createElement("div");
q.id="helpQuiz";
q.innerHTML='<div id="helpQuizCard"><h2>🔎 Buscar posibles ayudas</h2><div id="quizContent"></div></div>';

const m=document.querySelector("main");
if(m)m.insertBefore(b,m.firstChild);else document.body.insertBefore(b,document.body.firstChild);
document.body.appendChild(q);

const state={person:null,age:null,needs:[],impact:[],transport:null};

function render(x){document.getElementById("quizContent").innerHTML=x}
function option(label,fn){return `<button class="quizOption" onclick="${fn}">${label}</button>`}

function start(){
 state.person=null;state.age=null;state.needs=[];state.impact=[];state.transport=null;
 render(`<div class="quizProgress">Paso 1 de 5</div>
 <p><strong>¿Para quién buscas ayuda?</strong></p>
 ${option("👧 Para mi hijo/a","stqPerson('child')")}
 ${option("👤 Para mí / un adulto","stqPerson('adult')")}
 ${option("👨‍👩‍👧 Para mi familia","stqPerson('family')")}
 <button class="quizBack" onclick="closeStq()">← Volver</button>`);
}

window.stqPerson=function(p){
 state.person=p;
 render(`<div class="quizProgress">Paso 2 de 5</div>
 <p><strong>¿Qué edad tiene la persona?</strong></p>
 ${option("👶 0–5 años","stqAge('0-5')")}
 ${option("🧒 6–12 años","stqAge('6-12')")}
 ${option("👦 13–17 años","stqAge('13-17')")}
 ${option("🧑 18–29 años","stqAge('18-29')")}
 ${option("👨 30 años o más","stqAge('30+')")}
 <button class="quizBack" onclick="start()">← Atrás</button>`);
};

window.stqAge=function(a){
 state.age=a;
 render(`<div class="quizProgress">Paso 3 de 5</div>
 <p><strong>¿Qué necesidades quieres investigar?</strong><br><small>Puedes elegir una o varias.</small></p>
 ${option("♿ Discapacidad / necesidades de apoyo","stqToggle('disability')")}
 ${option("🧩 Autismo u otra condición del desarrollo","stqToggle('autism')")}
 ${option("🧠 Discapacidad intelectual","stqToggle('intellectual')")}
 ${option("🏫 Escuela / problemas de asistencia o apoyo","stqToggle('school')")}
 ${option("🤝 Ayuda importante en actividades diarias","stqToggle('daily')")}
 ${option("🚕 Dificultad para utilizar transporte público","stqToggle('transport')")}
 ${option("🏠 Adaptación o problemas de vivienda","stqToggle('housing')")}
 ${option("💰 Economía / prestaciones","stqToggle('money')")}
 <button class="quizBack" onclick="stqImpact()">Continuar →</button>
 <button class="quizBack" onclick="stqPerson(state.person)">← Atrás</button>`);
};

window.stqToggle=function(n){
 if(!state.needs.includes(n))state.needs.push(n);else state.needs=state.needs.filter(x=>x!==n);
 const el=document.getElementById("quizContent");
 const btns=el.querySelectorAll(".quizOption");
 const names={disability:"♿ Discapacidad / necesidades de apoyo",autism:"🧩 Autismo u otra condición del desarrollo",intellectual:"🧠 Discapacidad intelectual",school:"🏫 Escuela / problemas de asistencia o apoyo",daily:"🤝 Ayuda importante en actividades diarias",transport:"🚕 Dificultad para utilizar transporte público",housing:"🏠 Adaptación o problemas de vivienda",money:"💰 Economía / prestaciones"};
 btns.forEach(btn=>{for(const k in names)if(btn.textContent.includes(names[k]))btn.style.fontWeight=state.needs.includes(k)?"800":"400"});
};

window.stqImpact=function(){
 if(!state.needs.length){alert("Selecciona al menos una necesidad.");return}
 render(`<div class="quizProgress">Paso 4 de 5</div>
 <p><strong>¿Cómo afecta principalmente a la vida diaria?</strong></p>
 ${option("🔴 Necesita mucha ayuda o supervisión","stqImpactSet('high')")}
 ${option("🟠 Necesita ayuda algunas veces","stqImpactSet('medium')")}
 ${option("🟢 Necesita principalmente adaptaciones o información","stqImpactSet('low')")}
 <button class="quizBack" onclick="stqAge(state.age)">← Atrás</button>`);
};

window.stqImpactSet=function(x){
 state.impact=[x];
 render(`<div class="quizProgress">Paso 5 de 5</div>
 <p><strong>¿Hay dificultades importantes con el transporte?</strong></p>
 ${option("🚕 Sí, el transporte público es difícil","stqTransport('yes')")}
 ${option("🚌 No, puede utilizar transporte público","stqTransport('no')")}
 ${option("❓ No estoy seguro/a","stqTransport('unknown')")}
 <button class="quizBack" onclick="stqImpact()">← Atrás</button>`);
};

window.stqTransport=function(x){state.transport=x;showResults()};

function showResults(){
 const results=[];
 const add=(title,text,url)=>{if(!results.some(r=>r[0]===title))results.push([title,text,url])};

 if(state.needs.includes("daily")||state.needs.includes("disability")||state.needs.includes("autism")||state.needs.includes("intellectual")){
   add("♿ LSS / apoyo municipal","Investiga las medidas de apoyo que puede ofrecer el municipio según las necesidades y la situación de la persona.","https://www.socialstyrelsen.se/");
 }
 if(state.needs.includes("daily")&&(state.impact[0]==="high"||state.impact[0]==="medium")){
   add("🤝 Personlig assistans / asistencia personal","Puede ser relevante cuando existen necesidades personales importantes y se cumplen los requisitos aplicables. Conviene valorar primero qué necesidades concretas existen y cuánto apoyo requieren.","https://www.forsakringskassan.se/");
 }
 if(state.needs.includes("school")||state.person==="child"){
   add("🏫 Apoyo escolar","Investiga adaptaciones, apoyo especial, åtgärdsprogram y otras medidas educativas que puedan ser necesarias.","https://www.skolverket.se/");
 }
 if(state.needs.includes("transport")||state.transport==="yes"){
   add("🚕 Färdtjänst","Puede ser relevante cuando una discapacidad hace difícil utilizar el transporte público y se cumplen los requisitos aplicables.","https://goteborg.se/");
 }
 if(state.needs.includes("housing")){
   add("🏠 Bostadsanpassning","Investiga si puede solicitarse una adaptación de la vivienda debido a una discapacidad o limitación funcional.","https://www.boverket.se/");
 }
 if(state.needs.includes("money")){
   add("💰 Försäkringskassan","Comprueba qué prestaciones pueden ser relevantes para la situación personal o familiar.","https://www.forsakringskassan.se/");
 }
 if(state.needs.includes("autism")||state.needs.includes("intellectual")||state.needs.includes("disability")){
   add("📋 Försäkringskassan – prestaciones por discapacidad","Puede haber distintas prestaciones según edad, necesidades y circunstancias. Revisa las opciones oficiales antes de solicitar.","https://www.forsakringskassan.se/");
 }
 if(!results.length){
   add("🔎 Orientación general","No hay información suficiente para señalar una ayuda concreta. Empieza describiendo las necesidades principales y consulta el organismo correspondiente.","https://www.forsakringskassan.se/");
 }

 render(`<h3>⭐ Según tus respuestas, investiga primero:</h3>
 ${results.map(r=>`<div class="quizResult"><strong>${r[0]}</strong><br>${r[1]}<br><a href="${r[2]}" target="_blank" rel="noopener">Ver información oficial →</a></div>`).join("")}
 <div class="quizDisclaimer">ℹ️ <strong>Resultado orientativo:</strong> este cuestionario no determina si tienes derecho a una prestación. Los requisitos dependen de la situación individual y de la autoridad que tramite la ayuda.</div>
 <button class="quizBack" onclick="start()">🔄 Nueva búsqueda</button>
 <button class="quizBack" onclick="closeStq()">← Cerrar</button>`);
}
window.closeStq=function(){q.style.display="none"};
b.addEventListener("click",()=>{q.style.display="block";start();window.scrollTo(0,0)});
})();

/* ===== STÖDGUIDEN PREMIUM ===== */
(function () {
  const premiumStyle = document.createElement("style");
  premiumStyle.textContent = `
    #premiumBtn{display:block;width:100%;margin:18px 0;padding:16px;border:0;border-radius:18px;background:#d9a441;color:#172b4d;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12)}
    #premiumBox{display:none;position:fixed;inset:0;z-index:9999;overflow:auto;background:#f5f7fb;padding:18px}
    #premiumContent{max-width:720px;margin:15px auto;background:white;border-radius:24px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.16)}
    #premiumContent h2{text-align:center;color:#173b63;margin:4px 0 8px}
    .premiumIntro{text-align:center;line-height:1.5}
    .premiumCard{background:#eef4ff;border-radius:18px;padding:18px;margin:13px 0}
    .premiumCard h3{margin:0 0 8px;color:#173b63}
    .premiumCard p{line-height:1.5;margin:0}
    .premiumOption{display:block;width:100%;margin:9px 0;padding:13px;border:1px solid #ccd5df;border-radius:12px;background:white;text-align:left;font-size:16px;cursor:pointer}
    .premiumClose{width:100%;padding:14px;margin-top:12px;border:0;border-radius:14px;background:#e8eef6;color:#173b63;font-size:17px;font-weight:700}
    .premiumNote{background:#fff5d9;border-radius:15px;padding:15px;margin-top:15px;line-height:1.5}
  `;
  document.head.appendChild(premiumStyle);

  const premiumBtn=document.createElement("button");
  premiumBtn.id="premiumBtn";
  premiumBtn.innerHTML="⭐ StödGuiden Premium";

  const premiumBox=document.createElement("div");
  premiumBox.id="premiumBox";
  premiumBox.innerHTML=`
    <div id="premiumContent">
      <h2>⭐ StödGuiden Premium</h2>
      <p class="premiumIntro">Herramientas prácticas para preparar mejor tus solicitudes de apoyo.</p>
      <div class="premiumCard"><h3>📋 Guías paso a paso</h3><p>Organiza qué necesitas comprobar, qué documentación preparar y qué pasos seguir antes de contactar con una autoridad.</p></div>
      <div class="premiumCard"><h3>✉️ Modelos de mensajes</h3><p>Modelos orientativos para contactar con escuela, municipio, Försäkringskassan y otros organismos.</p></div>
      <div class="premiumCard"><h3>📝 Preparar una solicitud</h3><p>Ayuda para ordenar necesidades, frecuencia, duración, documentación y preguntas que conviene preparar.</p></div>
      <div class="premiumCard"><h3>🏫 Escuela</h3><p>Orientación para hablar con la escuela sobre adaptaciones, apoyo especial y necesidades del alumno.</p></div>
      <div class="premiumCard"><h3>♿ LSS y asistencia personal</h3><p>Explicaciones organizadas sobre las áreas de apoyo que puedes investigar y cómo preparar una consulta.</p></div>
      <div class="premiumCard"><h3>🚕 Färdtjänst</h3><p>Información orientativa sobre dificultades de transporte, documentación y dónde buscar los requisitos aplicables.</p></div>
      <div class="premiumCard"><h3>❌ Si te han rechazado una ayuda</h3><p>Qué revisar en la resolución, qué documentos guardar y qué preguntas hacer sobre una posible revisión o recurso.</p></div>
      <div class="premiumCard"><h3>⭐ Orientación personalizada</h3><p>Haz una pequeña prueba para recibir una orientación inicial.</p><button class="premiumOption" onclick="premiumStart()">Empezar orientación</button><div id="premiumArea"></div></div>
      <div class="premiumNote">🔒 <strong>Fase de prueba:</strong> esta función todavía es gratuita. Primero queremos comprobar qué herramientas resultan realmente útiles para las familias.</div>
      <button class="premiumClose" onclick="document.getElementById('premiumBox').style.display='none'">← Volver</button>
    </div>`;

  document.body.appendChild(premiumBox);
  document.body.appendChild(premiumBtn);

  premiumBtn.addEventListener("click",function(){
    premiumBox.style.display="block";
    window.scrollTo(0,0);
  });

  window.premiumStart=function(){
    const es=lang==="es";
    document.getElementById("premiumArea").innerHTML=`<div class="premiumCard"><strong>${es?"1. ¿Para quién buscas apoyo?":"1. Vem söker du stöd för?"}</strong><button class="premiumOption" onclick="premiumNeed()">${es?"👧 Mi hijo/a":"👧 Mitt barn"}</button><button class="premiumOption" onclick="premiumNeed()">${es?"👤 Un adulto":"👤 En vuxen"}</button></div>`;
  };

  window.premiumNeed=function(){
    const es=lang==="es";
    document.getElementById("premiumArea").innerHTML=`<div class="premiumCard"><strong>${es?"2. ¿Qué necesitas principalmente?":"2. Vad behöver du främst hjälp med?"}</strong><button class="premiumOption" onclick="premiumResult('school')">${es?"🏫 Escuela":"🏫 Skola"}</button><button class="premiumOption" onclick="premiumResult('daily')">${es?"🤝 Ayuda en la vida diaria":"🤝 Stöd i vardagen"}</button><button class="premiumOption" onclick="premiumResult('transport')">${es?"🚕 Transporte":"🚕 Transport"}</button><button class="premiumOption" onclick="premiumResult('money')">${es?"💰 Ayudas económicas":"💰 Ekonomiskt stöd"}</button></div>`;
  };

  window.premiumResult=function(type){
    const es=lang==="es";
    const advice=es?{
      school:"Revisa el apoyo escolar y las adaptaciones disponibles. Documenta las necesidades y solicita una reunión con la escuela.",
      daily:"Investiga LSS y, si existen necesidades personales importantes y duraderas, la posibilidad de asistencia personal.",
      transport:"Comprueba si Färdtjänst puede ser aplicable y consulta los requisitos de tu municipio o región.",
      money:"Comprueba qué prestaciones de Försäkringskassan pueden ser relevantes para tu situación."
    }:{
      school:"Undersök skolans stöd och anpassningar. Dokumentera behoven och be om ett möte med skolan.",
      daily:"Undersök LSS och, om det finns omfattande och varaktiga personliga behov, möjligheten till personlig assistans.",
      transport:"Kontrollera om färdtjänst kan vara aktuell och vilka krav som gäller i din kommun eller region.",
      money:"Undersök vilka ersättningar från Försäkringskassan som kan vara aktuella."
    };
    document.getElementById("premiumArea").innerHTML=`<div class="premiumCard"><h3>${es?"⭐ Tu orientación inicial":"⭐ Din första vägledning"}</h3><p>${advice[type]}</p><p class="small">${es?"Esta orientación es general y no garantiza el derecho a una ayuda concreta.":"Detta är generell vägledning och garanterar inte rätt till en viss insats."}</p></div>`;
  };
})();

</script>
</body>
</html>
