<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StödGuiden</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef4f8;color:#18304a}
.app{max-width:430px;margin:auto;min-height:100vh;background:#fff}
header{padding:18px 20px 12px;text-align:center;background:linear-gradient(180deg,#f8fcff,#fff)}
.logo{font-size:30px;font-weight:800;color:#194b91}.tag{font-size:15px;margin-top:6px}
.langbar{display:flex;justify-content:center;gap:8px;margin:10px}
.langbar button{border:1px solid #cbd6e2;background:#fff;border-radius:20px;padding:10px 15px;cursor:pointer;font-size:16px}
.langbar .sel{background:#2855a3;color:#fff}
.hero{padding:8px 20px 20px;text-align:center}.hero h1{font-size:24px;margin:10px 0 8px}
.card{margin:0 16px 14px;padding:18px;border-radius:16px;background:#2855a3;color:white;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px #0001}
.card small{display:block;font-weight:400;margin-top:6px;font-size:13px}
.screen{display:none;padding:18px}.screen.active{display:block}
.back{border:0;background:none;color:#2855a3;font-size:16px;padding:4px 0 16px}
label{display:block;font-weight:700;margin:18px 0 8px}
select,textarea,input[type=number]{width:100%;padding:13px;border:1px solid #cbd6e2;border-radius:12px;font-size:16px;background:#fff}
textarea{min-height:110px;resize:vertical}
.checks label{font-weight:400;margin:8px 0;padding:11px;border:1px solid #dbe3ea;border-radius:10px}
.checks input{width:auto;margin-right:8px}.primary{width:100%;border:0;border-radius:14px;padding:15px;background:#2855a3;color:white;font-size:17px;font-weight:700;margin-top:20px}
.result{background:#f2f8f4;border-radius:14px;padding:16px;margin:12px 0;line-height:1.5}.result h3{margin-top:0}.result:first-child{border-left:5px solid #2855a3}
.note{font-size:12px;color:#526273;line-height:1.5;margin-top:18px}
.progress{font-size:13px;color:#526273;margin:8px 0}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">◉ StödGuiden</div><div class="tag" id="tag"></div></header>

<div class="langbar">
<button id="sv" onclick="setLang('sv')">🇸🇪 Svenska</button>
<button id="es" onclick="setLang('es')">🇪🇸 Español</button>
</div>

<div id="home" class="screen active">
<div class="hero"><h1 id="homeTitle"></h1></div>
<div class="card" onclick="show('wizard')">🔎 <span id="c1"></span><small id="s1"></small></div>
<div class="card" onclick="openCategory(1)">👧 <span id="c2"></span><small id="s2"></small></div>
<div class="card" onclick="openCategory(2)">♿ <span id="c3"></span><small id="s3"></small></div>
<div class="card" onclick="openCategory(3)">📋 <span id="c4"></span><small id="s4"></small></div>
<div class="card" onclick="openCategory(4)">🚕 <span id="c5"></span><small id="s5"></small></div>
<div class="card" onclick="openCategory(5)">🏫 <span id="c6"></span><small id="s6"></small></div>
<div class="card" onclick="openCategory(6)">🏠 <span id="c7"></span><small id="s7"></small></div>
<div class="card" onclick="openCategory(7)">⚖️ <span id="c8"></span><small id="s8"></small></div>
</div>

<div id="category" class="screen">
<button class="back" onclick="show('home')" id="catBack"></button>
<h2 id="catTitle"></h2><div id="catBox"></div>
<button class="primary" onclick="show('wizard')" id="catWizardBtn"></button>
<div class="note" id="catNote"></div>
</div>

<div id="wizard" class="screen">
<button class="back" onclick="show('home')" id="back"></button>
<h2 id="wTitle"></h2><p id="wIntro"></p>
<div class="progress" id="progress"></div>

<label id="whoLabel"></label><select id="who"></select>
<label id="ageLabel"></label><input id="age" type="number" min="0" max="120">

<label id="diffLabel"></label><div class="checks" id="checks"></div>
<label id="dailyLabel"></label><div class="checks" id="dailyChecks"></div>
<label id="schoolLabel"></label><div class="checks" id="schoolChecks"></div>
<label id="travelLabel"></label><div class="checks" id="travelChecks"></div>
<label id="nightLabel"></label><div class="checks" id="nightChecks"></div>
<label id="supportLabel"></label><div class="checks" id="supportChecks"></div>

<label id="storyLabel"></label><textarea id="story"></textarea>
<button class="primary" onclick="analyze()" id="analyzeBtn"></button>
</div>

<div id="results" class="screen">
<button class="back" onclick="show('wizard')" id="modify"></button>
<h2 id="rTitle"></h2><p id="intro"></p><div id="resultsBox"></div>
<button class="primary" id="payBtn"></button><div class="note" id="note"></div>
</div>
</div>

<script>
const T={
es:{
tag:"Halla el apoyo adecuado para ti y tu familia.",home:"¿Con qué necesitas ayuda?",
c:["No sé qué ayudas puedo solicitar","Ayudas para mi hijo","Asistencia personal","LSS","Färdtjänst","Escuela","Vivienda","Me han rechazado una ayuda"],
back:"← Volver",wt:"Vamos a conocerte un poco",wi:"Responde estas preguntas. No necesitas conocer el nombre de ninguna prestación.",
wl:"¿Para quién buscas ayuda?",opts:["Mi hijo/a","Para mí","Otro familiar"],al:"Edad",dl:"¿Qué dificultades existen?",
sl:"Cuéntanos con tus palabras qué está pasando",ph:"Escribe aquí la situación diaria y qué ayuda necesitas...",ab:"Ver posibles apoyos",
mod:"← Modificar respuestas",rt:"Posibles apoyos a investigar",pay:"📄 Preparar mi solicitud personalizada — 9,90 €",
note:"Esta orientación no garantiza que tengas derecho a una prestación. Las decisiones corresponden a la autoridad competente.",
diff:["Autismo","Discapacidad intelectual","Movilidad / desplazamientos","Necesidad de supervisión","Dificultades en la escuela","Necesidad de ayuda personal"],
res:["♿ Personlig assistans","Podría ser relevante investigar si existe una necesidad importante y duradera de ayuda personal.","📋 LSS","Conviene comprobar qué apoyos pueden ser aplicables según la situación y las condiciones legales.","🚕 Färdtjänst","Puede ser útil investigar el transporte adaptado si existen dificultades importantes para desplazarse por medios ordinarios.","🏫 Apoyo escolar","Puede ser necesario hablar con la escuela y el municipio sobre las medidas de apoyo que correspondan."]
},
sv:{
tag:"Hitta rätt stöd för dig och din familj.",home:"Vad behöver du hjälp med?",
c:["Jag vet inte vilket stöd jag kan söka","Stöd för mitt barn","Personlig assistans","LSS","Färdtjänst","Skola","Bostad","Jag har fått avslag på stöd"],
back:"← Tillbaka",wt:"Berätta lite om din situation",wi:"Svara på frågorna. Du behöver inte känna till namnet på någon insats.",
wl:"Vem söker du stöd för?",opts:["Mitt barn","För mig själv","Annan familjemedlem"],al:"Ålder",dl:"Vilka svårigheter finns?",
sl:"Berätta med egna ord vad som händer",ph:"Beskriv vardagen och vilket stöd som behövs...",ab:"Se möjliga stöd",
mod:"← Ändra svar",rt:"Möjliga stöd att undersöka",pay:"📄 Förbered min personliga ansökan — 9,90 €",
note:"Denna vägledning garanterar inte att du har rätt till en insats. Beslut fattas av ansvarig myndighet.",
diff:["Autism","Intellektuell funktionsnedsättning","Rörlighet / resor","Behov av tillsyn","Svårigheter i skolan","Behov av personlig hjälp"],
res:["♿ Personlig assistans","Det kan vara relevant att undersöka om det finns ett omfattande och varaktigt behov av personlig hjälp.","📋 LSS","Det är bra att kontrollera vilka stödinsatser som kan vara aktuella utifrån situationen och lagens villkor.","🚕 Färdtjänst","Det kan vara relevant att undersöka färdtjänst om det finns betydande svårigheter att resa med vanlig kollektivtrafik.","🏫 Stöd i skolan","Det kan vara bra att kontakta skolan och kommunen om vilka stödåtgärder som kan vara aktuella."]
}};

const Q={
es:{
dailyLabel:"¿Qué ayuda necesita en la vida diaria?",daily:["Ayuda para higiene, vestirse o comer","Ayuda para supervisión y seguridad","Ayuda para actividades y rutinas","No necesita ayuda diaria"],
schoolLabel:"¿Hay dificultades relacionadas con la escuela?",school:["Necesita adaptaciones o apoyo educativo","Tiene dificultades para asistir a la escuela","Necesita apoyo durante el transporte escolar","No hay dificultades escolares"],
travelLabel:"¿Cómo funcionan los desplazamientos?",travel:["Es difícil utilizar transporte público","Necesita Färdtjänst o más viajes","Necesita acompañamiento durante los desplazamientos","No tiene dificultades importantes para desplazarse"],
nightLabel:"¿Existe necesidad de ayuda o supervisión por la noche?",night:["Se despierta y necesita ayuda","Necesita supervisión o seguridad durante la noche","Hay episodios que requieren atención","No necesita ayuda por la noche"],
supportLabel:"¿Qué situación tienes actualmente?",support:["Ya recibo alguna ayuda y necesito más","Estoy esperando una decisión","Me han rechazado una ayuda","Todavía no he solicitado ninguna ayuda"],
progress:"Preguntas sobre las necesidades y la situación actual."
},
sv:{
dailyLabel:"Vilken hjälp behövs i vardagen?",daily:["Hjälp med hygien, påklädning eller mat","Hjälp med tillsyn och säkerhet","Hjälp med aktiviteter och rutiner","Behöver ingen daglig hjälp"],
schoolLabel:"Finns det svårigheter som rör skolan?",school:["Behöver anpassningar eller pedagogiskt stöd","Har svårt att gå till skolan","Behöver stöd under skolresan","Inga särskilda skolsvårigheter"],
travelLabel:"Hur fungerar resorna?",travel:["Det är svårt att använda kollektivtrafik","Behöver Färdtjänst eller fler resor","Behöver ledsagning under resor","Har inga större resesvårigheter"],
nightLabel:"Finns det behov av hjälp eller tillsyn på natten?",night:["Vaknar och behöver hjälp","Behöver tillsyn eller trygghet på natten","Har episoder som kräver uppmärksamhet","Behöver ingen hjälp på natten"],
supportLabel:"Vilken situation har du nu?",support:["Har redan stöd men behöver mer","Väntar på ett beslut","Har fått avslag på stöd","Har ännu inte ansökt om stöd"],
progress:"Frågor om behov och nuvarande situation."
}};

const CAT_SUB={
es:["Abrir asistente","Orientación inicial","Información general","Información general","Información general","Información general","Información general","Información general"],
sv:["Öppna assistenten","Första vägledning","Allmän information","Allmän information","Allmän information","Allmän information","Allmän information","Allmän information"]};

const CATS={
es:[
{title:"Ayudas para mi hijo",intro:"Aquí puedes orientarte sobre apoyos que una familia puede investigar según las necesidades del niño o adolescente.",items:["Personlig assistans / asistencia personal: puede ser relevante cuando existe una necesidad importante y duradera de ayuda personal.","LSS: conviene comprobar qué medidas de apoyo pueden ser aplicables a la situación concreta.","Escuela: la escuela y el municipio pueden informar sobre medidas de apoyo educativo y adaptaciones.","Färdtjänst: puede ser relevante si el transporte ordinario resulta especialmente difícil."]},
{title:"Asistencia personal",intro:"La asistencia personal puede ser una opción cuando una persona tiene necesidades importantes y duraderas de ayuda personal.",items:["Investiga si las necesidades de ayuda entran dentro de las condiciones de la asistencia personal.","Comprueba qué autoridad es responsable de la solicitud según la situación.","Guarda información sobre las necesidades en la vida diaria, frecuencia y duración de la ayuda."]},
{title:"LSS",intro:"LSS es una ley sueca que regula determinados apoyos para personas con discapacidad.",items:["Comprueba si la persona pertenece a alguno de los grupos previstos por la ley.","Investiga qué medidas pueden ser relevantes, por ejemplo acompañamiento, contacto personal u otras ayudas.","La autoridad competente realiza la valoración individual."]},
{title:"Färdtjänst",intro:"Färdtjänst es transporte especial para personas que tienen dificultades importantes para viajar con el transporte público ordinario.",items:["Comprueba los requisitos de tu municipio o región.","Describe qué dificultades existen al viajar de forma habitual.","La decisión depende de una valoración individual."]},
{title:"Escuela",intro:"Si un niño necesita apoyo en la escuela, es importante hablar con la escuela y documentar las necesidades.",items:["Pide una reunión con la escuela para explicar las dificultades concretas.","Pregunta qué adaptaciones y medidas de apoyo pueden ofrecerse.","Guarda por escrito las decisiones y los apoyos acordados."]},
{title:"Vivienda",intro:"Algunas personas pueden necesitar adaptaciones o apoyos relacionados con la vivienda.",items:["Describe qué dificultades existen en casa y qué adaptación se necesita.","Comprueba con el municipio qué ayudas pueden existir.","Solicita información por escrito sobre requisitos y documentación."]},
{title:"Me han rechazado una ayuda",intro:"Si has recibido una decisión negativa, primero revisa la resolución y los motivos indicados.",items:["Lee qué autoridad ha tomado la decisión y cuál es el motivo del rechazo.","Comprueba si la resolución indica cómo y cuándo puedes recurrir.","Guarda la resolución y toda la documentación relacionada."]}],
sv:[
{title:"Stöd för mitt barn",intro:"Här kan du få en första orientering om stöd som en familj kan undersöka utifrån barnets behov.",items:["Personlig assistans kan vara relevant när det finns ett omfattande och varaktigt behov av personlig hjälp.","LSS: kontrollera vilka stödinsatser som kan vara aktuella i den konkreta situationen.","Skola: skolan och kommunen kan informera om stödåtgärder och anpassningar.","Färdtjänst: kan vara relevant om vanlig kollektivtrafik är särskilt svår."]},
{title:"Personlig assistans",intro:"Personlig assistans kan vara aktuell när en person har omfattande och varaktiga behov av personlig hjälp.",items:["Undersök om hjälpbehoven omfattas av reglerna för personlig assistans.","Kontrollera vilken myndighet som ansvarar för ansökan i den aktuella situationen.","Dokumentera hjälpbehovens omfattning, frekvens och varaktighet."]},
{title:"LSS",intro:"LSS är en svensk lag som reglerar vissa stödinsatser för personer med funktionsnedsättning.",items:["Kontrollera om personen tillhör någon av de personkretsar som omfattas av lagen.","Undersök vilka insatser som kan vara relevanta, till exempel ledsagning, kontaktperson eller annat stöd.","Ansvarig myndighet gör en individuell bedömning."]},
{title:"Färdtjänst",intro:"Färdtjänst är särskild kollektivtrafik för personer som har betydande svårigheter att resa med vanlig kollektivtrafik.",items:["Kontrollera vilka krav som gäller i din kommun eller region.","Beskriv vilka svårigheter som finns vid vanliga resor.","Beslutet grundas på en individuell bedömning."]},
{title:"Skola",intro:"Om ett barn behöver stöd i skolan är det viktigt att prata med skolan och dokumentera behoven.",items:["Be om ett möte med skolan och beskriv de konkreta svårigheterna.","Fråga vilka anpassningar och stödåtgärder som kan erbjudas.","Spara skriftlig information om beslutade stödåtgärder."]},
{title:"Bostad",intro:"Vissa personer kan behöva anpassningar eller stöd som rör bostaden.",items:["Beskriv vilka svårigheter som finns i hemmet och vilken anpassning som behövs.","Kontrollera med kommunen vilka stöd som kan finnas.","Be om skriftlig information om krav och dokumentation."]},
{title:"Jag har fått avslag på stöd",intro:"Om du har fått ett negativt beslut bör du först läsa beslutet och skälen som anges.",items:["Kontrollera vilken myndighet som fattat beslutet och varför ansökan avslogs.","Se om beslutet beskriver hur och när du kan överklaga.","Spara beslutet och all dokumentation som hör till ärendet."]}]};

let lang="es";

function fillChecks(id,items){document.getElementById(id).innerHTML=items.map((x,i)=>`<label><input type="checkbox" value="${i}"> ${x}</label>`).join("")}
function checked(id){return [...document.querySelectorAll("#"+id+" input:checked")].map(x=>+x.value)}
function makeExclusive(id, noneIndex){
  const box=document.getElementById(id);
  box.addEventListener("change",e=>{
    if(!e.target.matches("input")) return;
    const inputs=[...box.querySelectorAll("input")];
    if(e.target.checked && +e.target.value===noneIndex){
      inputs.forEach(x=>{if(x!==e.target)x.checked=false});
    }else if(e.target.checked && noneIndex!==undefined){
      const none=inputs.find(x=>+x.value===noneIndex);
      if(none) none.checked=false;
    }
  });
}

function setLang(l){
lang=l;const t=T[l],q=Q[l];document.documentElement.lang=l;
document.getElementById("tag").textContent=t.tag;document.getElementById("homeTitle").textContent=t.home;
for(let i=1;i<=8;i++){document.getElementById("c"+i).textContent=t.c[i-1];document.getElementById("s"+i).textContent=CAT_SUB[l][i-1]}
document.getElementById("back").textContent=t.back;document.getElementById("wTitle").textContent=t.wt;document.getElementById("wIntro").textContent=t.wi;
document.getElementById("whoLabel").textContent=t.wl;document.getElementById("ageLabel").textContent=t.al;document.getElementById("diffLabel").textContent=t.dl;
document.getElementById("storyLabel").textContent=t.sl;document.getElementById("story").placeholder=t.ph;document.getElementById("analyzeBtn").textContent=t.ab;
document.getElementById("modify").textContent=t.mod;document.getElementById("rTitle").textContent=t.rt;document.getElementById("payBtn").textContent=t.pay;document.getElementById("note").textContent=t.note;
document.getElementById("progress").textContent=q.progress;
document.getElementById("who").innerHTML=t.opts.map(x=>`<option>${x}</option>`).join("");
fillChecks("checks",t.diff);
document.getElementById("dailyLabel").textContent=q.dailyLabel;fillChecks("dailyChecks",q.daily);
document.getElementById("schoolLabel").textContent=q.schoolLabel;fillChecks("schoolChecks",q.school);
document.getElementById("travelLabel").textContent=q.travelLabel;fillChecks("travelChecks",q.travel);
document.getElementById("nightLabel").textContent=q.nightLabel;fillChecks("nightChecks",q.night);
document.getElementById("supportLabel").textContent=q.supportLabel;fillChecks("supportChecks",q.support);
document.getElementById("sv").className=l==="sv"?"sel":"";
document.getElementById("es").className=l==="es"?"sel":"";
}

function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");scrollTo(0,0)}

function openCategory(i){
const c=CATS[lang][i-1];
document.getElementById("catTitle").textContent=c.title;
document.getElementById("catBox").innerHTML=`<p>${c.intro}</p>${c.items.map(x=>`<div class="result">${x}</div>`).join("")}`;
document.getElementById("catBack").textContent=T[lang].back;
document.getElementById("catWizardBtn").textContent=lang==="es"?"🔎 Abrir el asistente":"🔎 Öppna assistenten";
document.getElementById("catNote").textContent=T[lang].note;show("category");
}

function analyze(){
const t=T[lang],c=checked("checks"),d=checked("dailyChecks"),s=checked("schoolChecks"),tr=checked("travelChecks"),n=checked("nightChecks"),sp=checked("supportChecks");
let items=[];const add=(a,b)=>items.push([a,b]);

if(c.some(x=>[0,1,3,5].includes(x))||d.some(x=>[0,1,2].includes(x))||n.some(x=>[0,1,2].includes(x)))add(t.res[0],t.res[1]);
if(c.includes(0)||c.includes(1)||d.some(x=>[0,1].includes(x)))add(t.res[2],t.res[3]);
if(c.includes(2)||tr.some(x=>[0,1,2].includes(x)))add(t.res[4],t.res[5]);
if(c.includes(4)||s.some(x=>[0,1,2].includes(x)))add(t.res[6],t.res[7]);

if(sp.includes(2))add(lang==="es"?"⚖️ Revisar el rechazo":"⚖️ Gå igenom avslaget",
lang==="es"?"Revisa la resolución, los motivos y el plazo indicado para recurrir.":"Gå igenom beslutet, skälen och den angivna tiden för att överklaga.");
if(s.some(x=>[0,1,2].includes(x)))add(lang==="es"?"🏫 Apoyo escolar":"🏫 Stöd i skolan",
lang==="es"?"Puede ser útil pedir a la escuela que documente las necesidades y las medidas de apoyo.":"Det kan vara bra att be skolan dokumentera behoven och stödåtgärderna.");
if(n.some(x=>[0,1,2].includes(x)))add(lang==="es"?"🌙 Necesidades nocturnas":"🌙 Behov på natten",
lang==="es"?"Anota frecuencia, duración y tipo de ayuda necesaria durante la noche.":"Dokumentera hur ofta, hur länge och vilken hjälp som behövs på natten.");

if(!items.length)items=[[lang==="es"?"🔎 Evaluación inicial":"🔎 Inledande bedömning",
lang==="es"?"Con más información podremos identificar qué apoyos conviene investigar.":"Med mer information kan vi identifiera vilket stöd som kan vara relevant att undersöka."]];

items = items.filter((item,index,self)=>index===self.findIndex(x=>x[0]===item[0]));

if(lang==="es"){
  items.sort((a,b)=>{
    const order=["♿","📋","🚕","🏫","⚖️","🌙","🔎"];
    return order.findIndex(x=>b[0].startsWith(x))-order.findIndex(x=>a[0].startsWith(x));
  });
}else{
  items.sort((a,b)=>{
    const order=["♿","📋","🚕","🏫","⚖️","🌙","🔎"];
    return order.findIndex(x=>b[0].startsWith(x))-order.findIndex(x=>a[0].startsWith(x));
  });
}

document.getElementById("intro").textContent=lang==="es"?"Según tus respuestas, estas son áreas que podrías investigar:":"Utifrån dina svar är detta stöd som du kan behöva undersöka:";
document.getElementById("resultsBox").innerHTML=items.map(i=>`<div class="result"><h3>${i[0]}</h3><div>${i[1]}</div></div>`).join("");
show("results");
}

document.getElementById("payBtn").onclick=()=>alert(lang==="es"?"El pago se activará en una fase posterior. Por ahora estamos probando la idea gratis.":"Betalningen aktiveras i ett senare steg. Just nu testar vi idén gratis.");

setLang("es");
["dailyChecks","schoolChecks","travelChecks","nightChecks","supportChecks"].forEach(id=>{
  const noneIndex = id==="dailyChecks"?3:id==="schoolChecks"?3:id==="travelChecks"?3:id==="nightChecks"?3:undefined;
  makeExclusive(id,noneIndex);
});
</script>
</body>
</html>
