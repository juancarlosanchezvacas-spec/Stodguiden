<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2f61aa">
<title>StödGuiden</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#17324d}
button{font:inherit;cursor:pointer}
header{text-align:center;padding:24px 18px 12px;background:#fff}
.logo{font-size:34px;font-weight:800;color:#24589b}.logo:before{content:"◉ ";font-size:24px}
.subtitle{font-size:18px;margin:8px 0 18px}
.langbar{display:flex;justify-content:center;gap:10px}.langbar button{border:1px solid #ccd5df;border-radius:28px;padding:11px 22px;background:#fff}
.langbar button.active{background:#2f61aa;color:#fff;border-color:#2f61aa}
main{max-width:720px;margin:auto;padding:18px}h1{text-align:center;font-size:30px;margin:25px 0}
.cards{display:grid;gap:14px}.card{width:100%;border:0;border-radius:24px;padding:19px 22px;background:#2f61aa;color:#fff;text-align:left;font-size:21px;font-weight:700;box-shadow:0 3px 8px #0002}
.card:active{transform:scale(.99)}.screen{display:none;background:#fff;border-radius:20px;padding:22px;margin-top:20px;box-shadow:0 2px 10px #0001}.screen.active{display:block}
.back{border:0;background:#e8eef6;color:#17324d;border-radius:14px;padding:10px 16px}
.result{margin-top:18px;padding:18px;background:#eef5ff;border-left:5px solid #2f61aa;border-radius:12px;line-height:1.55}
a{color:#175da8}.small{font-size:14px;color:#5c6b79}ul{padding-left:22px}
#quiz,#premium{display:none;position:fixed;inset:0;z-index:10000;background:#f5f7fb;overflow:auto;padding:18px}
.panel{max-width:720px;margin:10px auto;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 28px #0002}
.qbtn,.pbtn{display:block;width:100%;padding:14px;margin:9px 0;border:1px solid #d2dbe5;border-radius:13px;background:#fff;text-align:left}
.qbtn.selected{background:#eef4ff;border-color:#2f61aa}.close{width:100%;padding:13px;border:0;border-radius:13px;background:#e8eef6;color:#173b63;font-weight:700;margin-top:10px}
.qresult,.pcard{background:#eef4ff;border-radius:16px;padding:15px;margin:12px 0;line-height:1.5}
.note{background:#fff5d9;border-radius:14px;padding:13px;line-height:1.45;margin-top:15px;font-size:14px}
#premiumButton{display:block;width:100%;max-width:720px;margin:18px auto;padding:16px;border:0;border-radius:18px;background:#d9a441;color:#172b4d;font-weight:800}
@media(max-width:520px){.logo{font-size:30px}.subtitle{font-size:16px}.card{font-size:18px;padding:17px 18px}main{padding:12px}}
</style>
</head>
<body>
<header>
<div class="logo" data-i18n="title">StödGuiden</div>
<div class="subtitle" data-i18n="subtitle">Halla el apoyo adecuado para ti y tu familia.</div>
<div class="langbar"><button id="svBtn">🇸🇪 Svenska</button><button id="esBtn" class="active">🇪🇸 Español</button></div>
</header>

<main>
<section id="home" class="screen active">
<h1 data-i18n="question">¿Qué necesitas ayuda con?</h1>
<div class="cards">
<button class="card" data-card="unknown">🔎 No sé qué ayudas puedo solicitar</button>
<button class="card" data-card="child">👧 Ayudas para mi hijo</button>
<button class="card" data-card="assist">♿ Personlig assistans</button>
<button class="card" data-card="lss">📋 LSS</button>
<button class="card" data-card="transport">🚕 Färdtjänst</button>
<button class="card" data-card="school">🏫 Escuela</button>
<button class="card" data-card="housing">🏠 Vivienda</button>
<button class="card" data-card="rejected">❓ Me han rechazado una ayuda</button>
</div>
</section>
<section id="detail" class="screen"><button class="back" id="backBtn">← Volver</button><div id="detailContent"></div></section>
</main>

<div id="quiz"><div class="panel"><div id="quizContent"></div></div></div>
<div id="premium"><div class="panel"><div id="premiumContent"></div></div></div>
<button id="premiumButton">⭐ StödGuiden Premium</button>

<script>
"use strict";

const DATA={
es:{
title:"StödGuiden",subtitle:"Halla el apoyo adecuado para ti y tu familia.",question:"¿Qué necesitas ayuda con?",back:"← Volver",
cards:{unknown:"🔎 No sé qué ayudas puedo solicitar",child:"👧 Ayudas para mi hijo",assist:"♿ Personlig assistans",lss:"📋 LSS",transport:"🚕 Färdtjänst",school:"🏫 Escuela",housing:"🏠 Vivienda",rejected:"❓ Me han rechazado una ayuda"},
titles:{unknown:"Encontrar qué ayudas puedes solicitar",child:"Ayudas para tu hijo",assist:"Personlig assistans",lss:"LSS",transport:"Färdtjänst",school:"Escuela",housing:"Vivienda",rejected:"¿Te han rechazado una ayuda?"},
body:{
unknown:`<p>Si no sabes por dónde empezar, estas son algunas áreas que pueden ser relevantes para una familia en Suecia:</p><ul><li>Försäkringskassan y ayudas económicas</li><li>Personlig assistans</li><li>LSS y apoyo municipal</li><li>Färdtjänst</li><li>Apoyo escolar y adaptación educativa</li><li>Ayudas relacionadas con vivienda</li></ul><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan →</a> · <a href="https://goteborg.se/" target="_blank">Göteborgs Stad →</a></p>`,
child:`<p>Si tu hijo tiene una discapacidad o necesita mucho apoyo, hay varias áreas que conviene revisar.</p><ul><li><strong>Omvårdnadsbidrag:</strong> para padres cuyo hijo necesita atención y supervisión adicionales.</li><li><strong>Merkostnadsersättning:</strong> para costes adicionales debidos a la discapacidad.</li><li><strong>Personlig assistans / assistansersättning:</strong> cuando existen necesidades importantes de ayuda personal.</li><li><strong>LSS:</strong> distintas medidas de apoyo.</li><li><strong>Färdtjänst:</strong> si existen grandes dificultades para desplazarse con transporte público.</li><li><strong>Escuela:</strong> adaptaciones y apoyo especial.</li></ul><p><a href="https://www.forsakringskassan.se/privatperson/familj-och-barn/barn-med-funktionsnedsattning-eller-behov-av-extra-stod" target="_blank">Försäkringskassan – niños →</a></p><p><a href="https://www.skolverket.se/" target="_blank">Skolverket →</a></p>`,
assist:`<p><strong>Personlig assistans</strong> puede ser relevante cuando existe una necesidad importante y duradera de ayuda personal.</p><ul><li><strong>Necesidades básicas:</strong> higiene, comidas, vestirse/desvestirse, comunicación y otros apoyos incluidos en las reglas.</li><li><strong>Más de 20 horas:</strong> cuando las necesidades básicas superan en promedio 20 horas semanales, Försäkringskassan puede valorar assistansersättning.</li><li><strong>Niños:</strong> se aplica un ajuste por la ayuda que normalmente corresponde a los padres.</li><li><strong>Documentación:</strong> describe qué ayuda se necesita, frecuencia y duración.</li></ul><p><a href="https://www.forsakringskassan.se/privatperson/vuxen-med-funktionsnedsattning/assistansersattning/sa-beraknas-grundlaggande-behov" target="_blank">Ver necesidades básicas →</a></p>`,
lss:`<p><strong>LSS</strong> puede dar derecho a diferentes medidas de apoyo según la persona y sus necesidades.</p><ul><li>Personlig assistans</li><li>Kontaktperson</li><li>Ledsagarservice</li><li>Avlösarservice</li><li>Korttidsvistelse</li><li>Otras medidas según la situación</li></ul><p><a href="https://goteborg.se/" target="_blank">Göteborgs Stad →</a> · <a href="https://www.1177.se/" target="_blank">1177 →</a></p>`,
transport:`<p><strong>Färdtjänst</strong> es un transporte adaptado para personas con grandes dificultades para desplazarse o utilizar el transporte público.</p><ul><li>El diagnóstico por sí solo no garantiza el derecho.</li><li>Se valoran las dificultades reales para desplazarse y viajar.</li><li>En Göteborg se aplican requisitos específicos.</li><li>La primera solicitud puede requerir informe médico.</li><li>Puede existir la posibilidad de solicitar más viajes si ya tienes Färdtjänst.</li></ul><p><a href="https://goteborg.se/" target="_blank">Göteborgs Stad – Färdtjänst →</a></p>`,
school:`<p>Si tu hijo necesita apoyo escolar, la escuela debe valorar sus necesidades y las medidas adecuadas.</p><ul><li>Extra anpassningar</li><li>Särskilt stöd</li><li>Åtgärdsprogram</li><li>Elevhälsa</li><li>Posibilidad de investigar un cambio de escuela cuando proceda</li></ul><p>Es útil documentar dificultades, absentismo, medidas probadas y cómo afectan al niño.</p><p><a href="https://www.skolverket.se/" target="_blank">Skolverket →</a></p>`,
housing:`<p>Según la situación puede existir apoyo relacionado con vivienda o adaptación de la vivienda.</p><ul><li><strong>Bostadsanpassningsbidrag:</strong> puede ayudar a adaptar una vivienda cuando se cumplen los requisitos.</li><li><strong>Boende enligt LSS:</strong> puede ser relevante para determinadas personas.</li><li>También pueden existir otras ayudas económicas.</li></ul><p><a href="https://www.boverket.se/" target="_blank">Boverket →</a> · <a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan →</a></p>`,
rejected:`<p>Si te han rechazado una ayuda, revisa primero la resolución escrita.</p><ul><li>Comprueba el motivo del rechazo.</li><li>Comprueba el plazo para <strong>omprövning</strong> o recurso.</li><li>Guarda todos los documentos.</li><li>Prepara ejemplos concretos de las necesidades.</li></ul><p><strong>No dejes pasar el plazo.</strong></p><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan →</a> · <a href="https://www.domstol.se/" target="_blank">Sveriges Domstolar →</a></p>`
}},
sv:{
title:"StödGuiden",subtitle:"Hitta rätt stöd för dig och din familj.",question:"Vad behöver du hjälp med?",back:"← Tillbaka",
cards:{unknown:"🔎 Jag vet inte vilka stöd jag kan söka",child:"👧 Stöd för mitt barn",assist:"♿ Personlig assistans",lss:"📋 LSS",transport:"🚕 Färdtjänst",school:"🏫 Skola",housing:"🏠 Boende",rejected:"❓ Jag har fått avslag på ett stöd"},
titles:{unknown:"Hitta vilket stöd du kan söka",child:"Stöd för ditt barn",assist:"Personlig assistans",lss:"LSS",transport:"Färdtjänst",school:"Skola",housing:"Boende",rejected:"Har du fått avslag på ett stöd?"},
body:{
unknown:`<p>Om du inte vet var du ska börja kan flera stödområden vara aktuella:</p><ul><li>Försäkringskassan och ekonomiskt stöd</li><li>Personlig assistans</li><li>Insatser enligt LSS</li><li>Färdtjänst</li><li>Skolans stöd och anpassningar</li><li>Stöd kopplat till boende</li></ul><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan →</a> · <a href="https://goteborg.se/" target="_blank">Göteborgs Stad →</a></p>`,
child:`<p>Om ditt barn har en funktionsnedsättning eller behöver mycket stöd finns flera områden som kan vara aktuella.</p><ul><li><strong>Omvårdnadsbidrag:</strong> för föräldrar vars barn behöver extra omvårdnad och tillsyn.</li><li><strong>Merkostnadsersättning:</strong> för extra kostnader på grund av barnets funktionsnedsättning.</li><li><strong>Personlig assistans / assistansersättning:</strong> när det finns omfattande behov av personlig hjälp och kraven är uppfyllda.</li><li><strong>LSS:</strong> olika stödinsatser beroende på situationen.</li><li><strong>Färdtjänst:</strong> om barnet har stora svårigheter att resa med vanlig kollektivtrafik.</li><li><strong>Skola:</strong> anpassningar och särskilt stöd utifrån elevens behov.</li></ul><p><a href="https://www.forsakringskassan.se/privatperson/familj-och-barn/barn-med-funktionsnedsattning-eller-behov-av-extra-stod" target="_blank">Se Försäkringskassans stöd för barn →</a></p><p><a href="https://www.skolverket.se/" target="_blank">Se information från Skolverket →</a></p>`,
assist:`<p><strong>Personlig assistans</strong> kan vara aktuell när det finns omfattande och varaktiga behov av personlig hjälp.</p><ul><li><strong>Grundläggande behov:</strong> bland annat personlig hygien, måltider, av- och påklädning, kommunikation och andra behov som omfattas av reglerna.</li><li><strong>Mer än 20 timmar:</strong> om de grundläggande behoven i genomsnitt överstiger 20 timmar per vecka kan Försäkringskassan bedöma rätten till assistansersättning.</li><li><strong>Barn:</strong> ett föräldraavdrag görs för den hjälp som en vårdnadshavare normalt ska ge.</li><li><strong>Dokumentation:</strong> beskriv exakt vad som behövs, hur ofta och hur länge.</li><li><strong>Natt:</strong> relevanta behov under kvällar och nätter bör också dokumenteras.</li></ul><p><a href="https://www.forsakringskassan.se/privatperson/vuxen-med-funktionsnedsattning/assistansersattning/sa-beraknas-grundlaggande-behov" target="_blank">Se grundläggande behov →</a></p>`,
lss:`<p><strong>LSS</strong> kan ge rätt till särskilda stödinsatser för personer som omfattas av lagen.</p><ul><li>Personlig assistans</li><li>Kontaktperson</li><li>Ledsagarservice</li><li>Avlösarservice i hemmet</li><li>Korttidsvistelse</li><li>Korttidstillsyn för skolungdom när det är aktuellt</li><li>Boende med särskild service när det är aktuellt</li></ul><p>Vilken insats som kan vara aktuell beror på personens behov och situation.</p><p><a href="https://goteborg.se/" target="_blank">Göteborgs Stad →</a> · <a href="https://www.1177.se/" target="_blank">1177 →</a></p>`,
transport:`<p><strong>Färdtjänst</strong> kan vara ett alternativ när en funktionsnedsättning gör det svårt att resa med vanlig kollektivtrafik.</p><ul><li>Diagnosen i sig ger inte automatiskt rätt till färdtjänst.</li><li>De faktiska svårigheterna att förflytta sig och resa bedöms.</li><li>I Göteborg gäller särskilda krav.</li><li>Vid första ansökan kan ett medicinskt utlåtande behövas.</li><li>Det kan finnas möjlighet att ansöka om fler resor om du redan har färdtjänst.</li></ul><p><a href="https://goteborg.se/" target="_blank">Göteborgs Stad – Färdtjänst →</a></p>`,
school:`<p>Om ditt barn behöver mer stöd i skolan är det viktigt att skolan utreder elevens behov.</p><ul><li><strong>Extra anpassningar</strong></li><li><strong>Särskilt stöd</strong></li><li><strong>Åtgärdsprogram</strong></li><li><strong>Elevhälsa</strong></li><li><strong>Skolbyte</strong> när det är aktuellt</li></ul><p>Dokumentera gärna svårigheter, frånvaro, vad som har provats och hur barnet påverkas.</p><p><a href="https://www.skolverket.se/" target="_blank">Skolverket →</a></p>`,
housing:`<p>Det kan finnas olika former av stöd kopplat till boende.</p><ul><li><strong>Bostadsanpassningsbidrag:</strong> kan i vissa fall hjälpa till att anpassa bostaden.</li><li><strong>Boende enligt LSS:</strong> kan vara aktuellt för personer som behöver särskilt boende.</li><li>Andra ekonomiska stöd kan också vara relevanta.</li></ul><p><a href="https://www.boverket.se/" target="_blank">Boverket →</a> · <a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan →</a></p>`,
rejected:`<p>Om du har fått avslag på ett stöd ska du läsa beslutet noggrant.</p><ul><li>Kontrollera varför ansökan avslogs.</li><li>Kontrollera tidsfristen för <strong>omprövning eller överklagande</strong>.</li><li>Samla intyg och annan dokumentation.</li><li>Beskriv konkreta exempel på behoven.</li></ul><p><strong>Missa inte tidsfristen.</strong></p><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan →</a> · <a href="https://www.domstol.se/" target="_blank">Sveriges Domstolar →</a></p>`
}}
};

let lang="es";
const $=id=>document.getElementById(id);

function setLang(l){
  lang=l;
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.dataset.i18n;
    if(DATA[l][k]) el.textContent=DATA[l][k];
  });
  document.querySelectorAll("[data-card]").forEach(btn=>{
    btn.textContent=DATA[l].cards[btn.dataset.card];
  });
  $("backBtn").textContent=DATA[l].back;
  $("svBtn").classList.toggle("active",l==="sv");
  $("esBtn").classList.toggle("active",l==="es");
  if($("detail").classList.contains("active") && window.currentCard) openCard(window.currentCard);
}

function openCard(k){
  window.currentCard=k;
  $("home").classList.remove("active");
  $("detail").classList.add("active");
  $("detailContent").innerHTML="<h1>"+DATA[lang].titles[k]+"</h1><div class='result'>"+DATA[lang].body[k]+"</div>";
  window.scrollTo(0,0);
}
function goHome(){
  $("detail").classList.remove("active");
  $("home").classList.add("active");
  window.currentCard=null;
  window.scrollTo(0,0);
}

$("svBtn").addEventListener("click",()=>setLang("sv"));
$("esBtn").addEventListener("click",()=>setLang("es"));
$("backBtn").addEventListener("click",goHome);

/* UN ÚNICO controlador para las ocho tarjetas. */
document.querySelectorAll("[data-card]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(btn.dataset.card==="unknown") openQuiz();
    else openCard(btn.dataset.card);
  });
});

/* CUESTIONARIO */
const quizState={person:null,needs:[],current:null,night:false};
function qText(es,sv){return lang==="es"?es:sv}
function quizRender(s){$("quizContent").innerHTML=s}
function openQuiz(){$("quiz").style.display="block";quizStart()}
function closeQuiz(){$("quiz").style.display="none"}
function quizStart(){
 quizState.person=null;quizState.needs=[];quizState.current=null;quizState.night=false;
 quizRender(`<h2>🔎 ${qText("Buscar posibles ayudas","Hitta möjliga stöd")}</h2>
 <p>${qText("Responde a unas preguntas y te mostraremos áreas de apoyo que puede valer la pena investigar.","Svara på några frågor så visar vi stödområden som kan vara värda att undersöka.")}</p>
 <strong>${qText("1. ¿Para quién buscas ayuda?","1. Vem söker du stöd för?")}</strong>
 <button class="qbtn" data-qperson="child">👧 ${qText("Mi hijo/a","Mitt barn")}</button>
 <button class="qbtn" data-qperson="adult">👤 ${qText("Para mí / un adulto","För mig / en vuxen")}</button>
 <button class="qbtn" data-qperson="family">👨‍👩‍👧 ${qText("Para mi familia","För min familj")}</button>
 <button class="close" id="quizClose">← ${qText("Cerrar","Stäng")}</button>`);
 $("quizClose").onclick=closeQuiz;
 document.querySelectorAll("[data-qperson]").forEach(b=>b.onclick=()=>quizNeeds(b.dataset.qperson));
}
function quizNeeds(p){
 quizState.person=p;
 const opts=[["daily","🤝 Ayuda en la vida diaria","🤝 Stöd i vardagen"],["school","🏫 Escuela / educación","🏫 Skola / utbildning"],["transport","🚕 Transporte","🚕 Transport"],["night","🌙 Ayuda o supervisión por la noche","🌙 Hjälp eller tillsyn på natten"],["money","💰 Economía / prestaciones","💰 Ekonomi / ersättningar"],["housing","🏠 Vivienda","🏠 Boende"]];
 quizRender(`<h2>2. ${qText("¿Qué necesitas principalmente?","Vad behöver du främst hjälp med?")}</h2>
 <p>${qText("Puedes elegir varias opciones.","Du kan välja flera alternativ.")}</p>
 ${opts.map(o=>`<button class="qbtn" data-need="${o[0]}">${lang==="es"?o[1]:o[2]}</button>`).join("")}
 <button class="qbtn" id="quizNext">➡️ ${qText("Continuar","Fortsätt")}</button>
 <button class="close" id="quizBack">← ${qText("Atrás","Tillbaka")}</button>`);
 document.querySelectorAll("[data-need]").forEach(b=>b.onclick=()=>{
   const n=b.dataset.need;
   if(n==="night"){quizState.night=!quizState.night;b.classList.toggle("selected",quizState.night)}
   else{const i=quizState.needs.indexOf(n);if(i>=0){quizState.needs.splice(i,1);b.classList.remove("selected")}else{quizState.needs.push(n);b.classList.add("selected")}}
 });
 $("quizNext").onclick=quizSituation;
 $("quizBack").onclick=()=>quizStart();
}
function quizSituation(){
 if(!quizState.needs.length&&!quizState.night){alert(qText("Selecciona al menos una necesidad.","Välj minst ett behov."));return}
 quizRender(`<h2>3. ${qText("¿Cuál es tu situación actual?","Vilken situation har du nu?")}</h2>
 <button class="qbtn" data-situation="more">➕ ${qText("Ya recibo alguna ayuda y necesito más","Jag har redan stöd men behöver mer")}</button>
 <button class="qbtn" data-situation="waiting">⏳ ${qText("Estoy esperando una decisión","Jag väntar på ett beslut")}</button>
 <button class="qbtn" data-situation="rejected">❌ ${qText("Me han rechazado una ayuda","Jag har fått avslag på ett stöd")}</button>
 <button class="qbtn" data-situation="none">📝 ${qText("Todavía no he solicitado ninguna ayuda","Jag har ännu inte ansökt om stöd")}</button>
 <button class="close" id="quizBack2">← ${qText("Atrás","Tillbaka")}</button>`);
 document.querySelectorAll("[data-situation]").forEach(b=>b.onclick=()=>quizResult(b.dataset.situation));
 $("quizBack2").onclick=()=>quizNeeds(quizState.person);
}
function quizResult(situation){
 const out=[];
 const add=(title,body,url)=>out.push({title,body,url});
 if(quizState.needs.includes("daily")) add("♿ Personlig assistans",qText("Puede ser relevante investigar asistencia personal y otras medidas de apoyo cuando existen necesidades importantes y duraderas.","Det kan vara relevant att undersöka personlig assistans och andra stödinsatser när det finns omfattande och varaktiga personliga behov."),"https://www.forsakringskassan.se/");
 if(quizState.needs.includes("daily")) add("📋 LSS",qText("Investiga qué insats de LSS puede ser relevante.","Undersök vilken LSS-insats som kan vara aktuell."),"https://goteborg.se/");
 if(quizState.needs.includes("school")) add("🏫 "+qText("Escuela","Skola"),qText("Habla con la escuela sobre adaptaciones y apoyo especial.","Prata med skolan om anpassningar och särskilt stöd."),"https://www.skolverket.se/");
 if(quizState.needs.includes("transport")) add("🚕 Färdtjänst",qText("Comprueba los requisitos aplicables.","Kontrollera vilka krav som gäller."),"https://goteborg.se/");
 if(quizState.needs.includes("money")) add("💰 Försäkringskassan",qText("Revisa las prestaciones que pueden corresponder a tu situación.","Undersök vilka ersättningar som kan vara aktuella."),"https://www.forsakringskassan.se/");
 if(quizState.needs.includes("housing")) add("🏠 "+qText("Vivienda","Boende"),qText("Investiga apoyo para vivienda o adaptación cuando corresponda.","Undersök stöd för boende eller bostadsanpassning när det är aktuellt."),"https://www.boverket.se/");
 if(quizState.night) add("🌙 "+qText("Necesidades durante la noche","Behov på natten"),qText("Anota frecuencia, ayuda necesaria y duración de cada episodio.","Anteckna hur ofta personen vaknar, vilken hjälp som behövs och hur länge varje episod varar."),"https://www.forsakringskassan.se/");
 if(situation==="rejected") add("❌ "+qText("Ayuda rechazada","Avslag på stöd"),qText("Revisa motivos y plazo para omprövning o recurso.","Kontrollera skälen och tidsfristen för omprövning eller överklagande."),"https://www.forsakringskassan.se/");
 if(situation==="more") add("➕ "+qText("Necesitas más apoyo","Du behöver mer stöd"),qText("Reúne ejemplos concretos de las necesidades que no están cubiertas.","Samla konkreta exempel på behov som inte täcks."),"https://www.forsakringskassan.se/");
 if(situation==="waiting") add("⏳ "+qText("Esperando una decisión","Väntar på beslut"),qText("Guarda la solicitud y la documentación enviada.","Spara ansökan och inskickade handlingar."),"https://www.forsakringskassan.se/");
 if(!out.length) add("💰 Försäkringskassan",qText("Empieza revisando las prestaciones y apoyos que pueden corresponder.","Börja med att undersöka vilka ersättningar och stöd som kan vara aktuella."),"https://www.forsakringskassan.se/");
 quizRender(`<h2>⭐ ${qText("Orientación inicial","Första vägledning")}</h2>
 <p>${qText("Según tus respuestas, estas son las áreas que merece la pena investigar primero:","Utifrån dina svar är detta områden som kan vara värda att undersöka först:")}</p>
 ${out.map(x=>`<div class="qresult"><strong>${x.title}</strong><br>${x.body}<br><br><a href="${x.url}" target="_blank"> ${qText("Ver información oficial →","Se officiell information →")}</a></div>`).join("")}
 <div class="note">ℹ️ ${qText("Resultado orientativo. Comprueba siempre los requisitos oficiales.","Detta är generell vägledning. Kontrollera alltid de officiella kraven.")}</div>
 <button class="qbtn" id="quizAgain">🔄 ${qText("Nueva búsqueda","Ny sökning")}</button>
 <button class="close" id="quizDone">← ${qText("Cerrar","Stäng")}</button>`);
 $("quizAgain").onclick=quizStart;$("quizDone").onclick=closeQuiz;
}
