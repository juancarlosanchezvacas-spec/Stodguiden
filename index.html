<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StödGuiden</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#17324d}
header{text-align:center;padding:24px 18px 12px;background:white}
.logo{font-size:34px;font-weight:800;color:#24589b}
.logo::before{content:"◉ ";font-size:24px}
.subtitle{font-size:18px;margin:8px 0 18px}
.langbar{display:flex;justify-content:center;gap:10px}
.langbar button{border:1px solid #ccd5df;border-radius:28px;padding:11px 22px;background:white;font-size:17px;cursor:pointer}
.langbar button.active{background:#2f61aa;color:white;border-color:#2f61aa}
main{max-width:720px;margin:auto;padding:18px}
h1{text-align:center;font-size:30px;margin:25px 0}
.cards{display:grid;gap:14px}
.card{width:100%;border:0;border-radius:24px;padding:19px 22px;background:#2f61aa;color:white;text-align:left;font-size:21px;font-weight:700;cursor:pointer;box-shadow:0 3px 8px #0002}
.card:active{transform:scale(.99)}
.screen{display:none;background:white;border-radius:20px;padding:22px;margin-top:20px;box-shadow:0 2px 10px #0001}
.screen.active{display:block}
.back{border:0;background:#e8eef6;color:#17324d;border-radius:14px;padding:10px 16px;font-size:16px;cursor:pointer}
.option{display:block;width:100%;margin:12px 0;padding:15px;border:1px solid #ccd5df;border-radius:14px;background:#fff;text-align:left;font-size:17px;cursor:pointer}
.result{margin-top:18px;padding:18px;background:#eef5ff;border-left:5px solid #2f61aa;border-radius:12px}
a{color:#175da8}
.small{font-size:14px;color:#5c6b79}
ul{padding-left:22px}
</style>
</head>
<body>
<header>
  <div class="logo" data-i18n="title">StödGuiden</div>
  <div class="subtitle" data-i18n="subtitle">Hitta el apoyo adecuado para ti y tu familia.</div>
  <div class="langbar">
    <button id="svBtn" onclick="setLang('sv')">🇸🇪 Svenska</button>
    <button id="esBtn" class="active" onclick="setLang('es')">🇪🇸 Español</button>
  </div>
</header>

<main>
<section id="home" class="screen active">
<h1 data-i18n="question">¿Qué necesitas ayuda con?</h1>
<div class="cards">
<button class="card" onclick="openCard('unknown')" data-i18n="unknown">🔎 No sé qué ayudas puedo solicitar</button>
<button class="card" onclick="openCard('child')" data-i18n="child">👧 Ayudas para mi hijo</button>
<button class="card" onclick="openCard('assist')" data-i18n="assist">♿ Personlig assistans</button>
<button class="card" onclick="openCard('lss')" data-i18n="lss">📋 LSS</button>
<button class="card" onclick="openCard('transport')" data-i18n="transport">🚕 Färdtjänst</button>
<button class="card" onclick="openCard('school')" data-i18n="school">🏫 Escuela</button>
<button class="card" onclick="openCard('housing')" data-i18n="housing">🏠 Vivienda</button>
<button class="card" onclick="openCard('rejected')" data-i18n="rejected">❓ Me han rechazado una ayuda</button>
</div>
</section>

<section id="detail" class="screen">
<button class="back" onclick="goHome()" data-i18n="back">← Volver</button>
<div id="detailContent"></div>
</section>
</main>

<script>
const T={
es:{
title:"StödGuiden",subtitle:"Halla el apoyo adecuado para ti y tu familia.",
question:"¿Qué necesitas ayuda con?",back:"← Volver",
unknown:"🔎 No sé qué ayudas puedo solicitar",child:"👧 Ayudas para mi hijo",assist:"♿ Personlig assistans",lss:"📋 LSS",transport:"🚕 Färdtjänst",school:"🏫 Escuela",housing:"🏠 Vivienda",rejected:"❓ Me han rechazado una ayuda",
titles:{
unknown:"Encontrar qué ayudas puedes solicitar",child:"Ayudas para tu hijo",assist:"Personlig assistans",lss:"LSS",transport:"Färdtjänst",school:"Escuela",housing:"Vivienda",rejected:"¿Te han rechazado una ayuda?"
},
body:{
unknown:`<p>Si no sabes por dónde empezar, estas son algunas áreas que pueden ser relevantes para una familia en Suecia:</p><ul><li>Försäkringskassan y ayudas económicas</li><li>Personlig assistans</li><li>LSS y apoyo municipal</li><li>Färdtjänst</li><li>Apoyo escolar y adaptación educativa</li><li>Ayudas relacionadas con vivienda</li></ul><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a> · <a href="https://www.goteborg.se/" target="_blank">Göteborgs Stad</a></p>`,
child:`<p>Para un hijo que necesita apoyo adicional, pueden existir diferentes medidas según sus necesidades.</p><ul><li>Personlig assistans</li><li>Insatser enligt LSS</li><li>Färdtjänst</li><li>Apoyo y adaptaciones escolares</li><li>Ayudas de Försäkringskassan</li></ul><p><a href="https://www.forsakringskassan.se/" target="_blank">Ver Försäkringskassan</a></p>`,
assist:`<p>Personlig assistans puede proporcionar apoyo en las actividades personales cuando se cumplen los requisitos legales.</p><ul><li>Ayuda en necesidades personales básicas</li><li>Solicitud y evaluación de necesidades</li><li>Seguimiento y cambios de horas</li></ul><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a></p>`,
lss:`<p>LSS es una ley sueca que permite determinadas medidas de apoyo para personas con discapacidad.</p><ul><li>Personlig assistans</li><li>Kontaktperson</li><li>Ledsagarservice</li><li>Korttidsvistelse</li><li>Avlösarservice</li></ul><p><a href="https://www.1177.se/" target="_blank">1177</a> · <a href="https://www.goteborg.se/" target="_blank">Göteborgs Stad</a></p>`,
transport:`<p>Färdtjänst puede ser una alternativa cuando una discapacidad hace difícil utilizar el transporte público.</p><p>En Göteborg puedes consultar las condiciones y solicitar información a través de la ciudad.</p><p><a href="https://goteborg.se/" target="_blank">Göteborgs Stad</a></p>`,
school:`<p>Si tu hijo necesita adaptaciones o un entorno escolar diferente, puedes solicitar una evaluación de sus necesidades y hablar con la escuela y el municipio.</p><ul><li>Extra anpassningar</li><li>Särskilt stöd</li><li>Åtgärdsprogram</li><li>Cambio de escuela cuando proceda</li></ul><p><a href="https://www.skolverket.se/" target="_blank">Skolverket</a></p>`,
housing:`<p>Según la situación, puede existir apoyo relacionado con vivienda, adaptación de la vivienda o economía familiar.</p><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a> · <a href="https://www.boverket.se/" target="_blank">Boverket</a></p>`,
rejected:`<p>Si te han rechazado una ayuda, revisa primero la resolución escrita. Normalmente indicará los motivos y qué plazo existe para recurrir.</p><p><strong>No dejes pasar el plazo.</strong> Guarda la resolución y todos los documentos.</p><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a> · <a href="https://www.domstol.se/" target="_blank">Sveriges Domstolar</a></p>`
}},
sv:{
title:"StödGuiden",subtitle:"Hitta rätt stöd för dig och din familj.",question:"Vad behöver du hjälp med?",back:"← Tillbaka",
unknown:"🔎 Jag vet inte vilka stöd jag kan söka",child:"👧 Stöd för mitt barn",assist:"♿ Personlig assistans",lss:"📋 LSS",transport:"🚕 Färdtjänst",school:"🏫 Skola",housing:"🏠 Boende",rejected:"❓ Jag har fått avslag på ett stöd",
titles:{unknown:"Hitta vilket stöd du kan söka",child:"Stöd för ditt barn",assist:"Personlig assistans",lss:"LSS",transport:"Färdtjänst",school:"Skola",housing:"Boende",rejected:"Har du fått avslag på ett stöd?"},
body:{
unknown:`<p>Om du inte vet var du ska börja kan flera stödområden vara aktuella:</p><ul><li>Försäkringskassan och ekonomiskt stöd</li><li>Personlig assistans</li><li>Insatser enligt LSS</li><li>Färdtjänst</li><li>Skolans stöd och anpassningar</li><li>Stöd kopplat till boende</li></ul><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a> · <a href="https://www.goteborg.se/" target="_blank">Göteborgs Stad</a></p>`,
child:`<p>För ett barn som behöver extra stöd kan flera insatser vara aktuella beroende på barnets behov.</p><ul><li>Personlig assistans</li><li>Insatser enligt LSS</li><li>Färdtjänst</li><li>Stöd och anpassningar i skolan</li><li>Stöd från Försäkringskassan</li></ul><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a></p>`,
assist:`<p>Personlig assistans kan ge stöd i personliga behov när de lagstadgade kraven är uppfyllda.</p><ul><li>Stöd med grundläggande behov</li><li>Ansökan och behovsbedömning</li><li>Uppföljning och förändring av timmar</li></ul><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a></p>`,
lss:`<p>LSS är en lag som ger vissa personer med funktionsnedsättning rätt till särskilda stödinsatser.</p><ul><li>Personlig assistans</li><li>Kontaktperson</li><li>Ledsagarservice</li><li>Korttidsvistelse</li><li>Avlösarservice</li></ul><p><a href="https://www.1177.se/" target="_blank">1177</a> · <a href="https://www.goteborg.se/" target="_blank">Göteborgs Stad</a></p>`,
transport:`<p>Färdtjänst kan vara ett alternativ när en funktionsnedsättning gör det svårt att resa med kollektivtrafik.</p><p><a href="https://goteborg.se/" target="_blank">Göteborgs Stad</a></p>`,
school:`<p>Om ditt barn behöver anpassningar eller en annan skolmiljö kan du prata med skolan och kommunen om barnets stödbehov.</p><ul><li>Extra anpassningar</li><li>Särskilt stöd</li><li>Åtgärdsprogram</li><li>Skolbyte när det är aktuellt</li></ul><p><a href="https://www.skolverket.se/" target="_blank">Skolverket</a></p>`,
housing:`<p>Beroende på situation kan det finnas stöd för boende, bostadsanpassning eller familjens ekonomi.</p><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a> · <a href="https://www.boverket.se/" target="_blank">Boverket</a></p>`,
rejected:`<p>Om du har fått avslag på ett stöd ska du först läsa beslutet noggrant. Där står normalt skälen och vilken tid du har för att begära omprövning eller överklaga.</p><p><strong>Missa inte tidsfristen.</strong></p><p><a href="https://www.forsakringskassan.se/" target="_blank">Försäkringskassan</a> · <a href="https://www.domstol.se/" target="_blank">Sveriges Domstolar</a></p>`
}}
};
let lang='es';
function setLang(l){
 lang=l;
 document.documentElement.lang=l;
 document.querySelectorAll('[data-i18n]').forEach(e=>{let k=e.dataset.i18n;if(T[l][k])e.innerHTML=T[l][k]});
 document.getElementById('svBtn').classList.toggle('active',l==='sv');
 document.getElementById('esBtn').classList.toggle('active',l==='es');
 if(document.getElementById('detail').classList.contains('active') && window.currentCard) openCard(window.currentCard);
}
function openCard(k){
 window.currentCard=k;
 document.getElementById('home').classList.remove('active');
 document.getElementById('detail').classList.add('active');
 document.getElementById('detailContent').innerHTML='<h1>'+T[lang].titles[k]+'</h1><div class="result">'+T[lang].body[k]+'</div>';
 window.scrollTo(0,0);
}
function goHome(){
 document.getElementById('detail').classList.remove('active');
 document.getElementById('home').classList.add('active');
 window.scrollTo(0,0);
}
  /* ===== STÖDGUIDEN PREMIUM ===== */

(function () {

  const premiumStyle = document.createElement("style");
  premiumStyle.textContent = `
    #premiumBtn{
      display:block;
      width:100%;
      margin:18px 0;
      padding:16px;
      border:0;
      border-radius:18px;
      background:#d9a441;
      color:#172b4d;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 4px 12px rgba(0,0,0,.15);
    }

    #premiumBox{
      display:none;
      position:fixed;
      inset:0;
      z-index:9999;
      background:rgba(0,0,0,.65);
      padding:20px;
      overflow:auto;
    }

    #premiumContent{
      max-width:650px;
      margin:30px auto;
      background:white;
      color:#17304d;
      border-radius:24px;
      padding:25px;
      box-shadow:0 10px 40px rgba(0,0,0,.3);
    }

    #premiumContent h2{
      text-align:center;
      font-size:28px;
      margin-top:5px;
    }

    .premiumItem{
      background:#eef4ff;
      padding:15px;
      border-radius:15px;
      margin:12px 0;
    }

    .premiumClose{
      width:100%;
      padding:13px;
      margin-top:15px;
      border:0;
      border-radius:14px;
      background:#e8eef6;
      font-size:16px;
      cursor:pointer;
    }

    .premiumSoon{
      text-align:center;
      padding:15px;
      background:#fff5d9;
      border-radius:15px;
      margin-top:18px;
    }
  `;
  document.head.appendChild(premiumStyle);


  /* Botón Premium */
  const premiumBtn = document.createElement("button");
  premiumBtn.id = "premiumBtn";
  premiumBtn.innerHTML = "⭐ StödGuiden Premium";
  
  const main = document.querySelector("main");

  if(main){
    main.insertBefore(premiumBtn, main.firstChild);
  } else {
    document.body.insertBefore(premiumBtn, document.body.firstChild);
  }


  /* Ventana Premium */
  const premiumBox = document.createElement("div");
  premiumBox.id = "premiumBox";

  premiumBox.innerHTML = `
    <div id="premiumContent">

      <h2>⭐ StödGuiden Premium</h2>

      <p style="text-align:center">
        Herramientas y guías más completas para familias
        que necesitan apoyo en Suecia.
      </p>

      <div class="premiumItem">
        <strong>📋 Guías paso a paso</strong>
        <p>
          Cómo solicitar ayudas y qué documentación preparar.
        </p>
      </div>

      <div class="premiumItem">
        <strong>✉️ Modelos de mensajes</strong>
        <p>
          Textos preparados para Försäkringskassan,
          escuela, municipio y otros organismos.
        </p>
      </div>

      <div class="premiumItem">
        <strong>💰 Ayudas económicas</strong>
        <p>
          Información organizada sobre las principales
          ayudas y prestaciones.
        </p>
      </div>

      <div class="premiumItem">
        <strong>🏫 Escuela</strong>
        <p>
          Orientación para solicitar adaptaciones,
          apoyo especial y cambio de escuela.
        </p>
      </div>

      <div class="premiumItem">
        <strong>♿ LSS y discapacidad</strong>
        <p>
          Explicaciones sencillas sobre los apoyos
          disponibles y cómo empezar.
        </p>
      </div>

      <div class="premiumItem">
        <strong>🚕 Färdtjänst</strong>
        <p>
          Guía para entender y solicitar el transporte
          adaptado.
        </p>
      </div>

      <div class="premiumSoon">
        🔒 <strong>Contenido Premium</strong><br>
        Estamos preparando las herramientas completas.
      </div>

      <button class="premiumClose" onclick="
        document.getElementById('premiumBox').style.display='none'
      ">
        ← Volver
      </button>

    </div>
  `;

  document.body.appendChild(premiumBox);


  premiumBtn.addEventListener("click", function(){
    premiumBox.style.display = "block";
  });

})();
</script>
</body>
</html>
