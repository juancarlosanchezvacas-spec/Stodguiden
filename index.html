<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StödGuiden</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef4f8;color:#18304a}.app{max-width:430px;margin:auto;min-height:100vh;background:#fff}
header{padding:18px 20px 12px;text-align:center;background:linear-gradient(180deg,#f8fcff,#fff)}.logo{font-size:30px;font-weight:800;color:#194b91}.tag{font-size:15px;margin-top:6px}
.langbar{display:flex;justify-content:center;gap:8px;margin:10px}.langbar button{border:1px solid #cbd6e2;background:#fff;border-radius:20px;padding:7px 13px;cursor:pointer}.langbar .sel{background:#2855a3;color:#fff}
.hero{padding:8px 20px 20px;text-align:center}.hero h1{font-size:24px;margin:10px 0 8px}.card{margin:0 16px 14px;padding:18px;border-radius:16px;background:#2855a3;color:white;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px #0001}.card small{display:block;font-weight:400;margin-top:6px;font-size:13px}
.screen{display:none;padding:18px}.screen.active{display:block}.back{border:0;background:none;color:#2855a3;font-size:16px;padding:4px 0 16px}label{display:block;font-weight:700;margin:18px 0 8px}
select,textarea,input[type=number]{width:100%;padding:13px;border:1px solid #cbd6e2;border-radius:12px;font-size:16px;background:#fff}textarea{min-height:110px;resize:vertical}.checks label{font-weight:400;margin:8px 0;padding:11px;border:1px solid #dbe3ea;border-radius:10px}.checks input{width:auto;margin-right:8px}.primary{width:100%;border:0;border-radius:14px;padding:15px;background:#2855a3;color:white;font-size:17px;font-weight:700;margin-top:20px}.result{background:#f2f8f4;border-radius:14px;padding:16px;margin:12px 0}.result h3{margin-top:0}.note{font-size:12px;color:#526273;line-height:1.5;margin-top:18px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">◉ StödGuiden</div><div class="tag" id="tag"></div></header>
<div class="langbar"><button id="sv" onclick="setLang('sv')">🇸🇪 Svenska</button><button id="es" onclick="setLang('es')">🇪🇸 Español</button></div>

<div id="home" class="screen active">
<div class="hero"><h1 id="homeTitle"></h1></div>
<div class="card" onclick="show('wizard')">🔎 <span id="c1"></span></div>
<div class="card">👧 <span id="c2"></span></div><div class="card">♿ <span id="c3"></span></div><div class="card">📋 <span id="c4"></span></div><div class="card">🚕 <span id="c5"></span></div><div class="card">🏫 <span id="c6"></span></div><div class="card">🏠 <span id="c7"></span></div><div class="card">⚖️ <span id="c8"></span></div>
</div>

<div id="wizard" class="screen"><button class="back" onclick="show('home')" id="back"></button><h2 id="wTitle"></h2><p id="wIntro"></p>
<label id="whoLabel"></label><select id="who"></select>
<label id="ageLabel"></label><input id="age" type="number" min="0" max="120">
<label id="diffLabel"></label><div class="checks" id="checks"></div>
<label id="storyLabel"></label><textarea id="story"></textarea>
<button class="primary" onclick="analyze()" id="analyzeBtn"></button></div>

<div id="results" class="screen"><button class="back" onclick="show('wizard')" id="modify"></button><h2 id="rTitle"></h2><p id="intro"></p><div id="resultsBox"></div><button class="primary" id="payBtn"></button><div class="note" id="note"></div></div>
</div>
<script>
const T={
es:{tag:"Halla el apoyo adecuado para ti y tu familia.",home:"¿Qué necesitas ayuda con?",c:["No sé qué ayudas puedo solicitar","Ayudas para mi hijo","Personlig assistans","LSS","Färdtjänst","Escuela","Vivienda","Me han rechazado una ayuda"],back:"← Volver",wt:"Vamos a conocerte un poco",wi:"Responde estas preguntas. No necesitas conocer el nombre de ninguna prestación.",wl:"¿Para quién buscas ayuda?",opts:["Mi hijo/a","Para mí","Otro familiar"],al:"Edad",dl:"¿Qué dificultades existen?",sl:"Cuéntanos con tus palabras qué está pasando",ph:"Escribe aquí la situación diaria y qué ayuda necesitas...",ab:"Ver posibles apoyos",mod:"← Modificar respuestas",rt:"Posibles apoyos a investigar",pay:"📄 Preparar mi solicitud personalizada — 9,90 €",note:"Esta orientación no garantiza que tengas derecho a una prestación. Las decisiones corresponden a la autoridad competente.",diff:["Autismo","Discapacidad intelectual","Movilidad / desplazamientos","Necesidad de supervisión","Dificultades en la escuela","Necesidad de ayuda personal"],res:["♿ Personlig assistans","Podría ser relevante investigar si existe una necesidad importante y duradera de ayuda personal.","📋 LSS","Conviene comprobar qué apoyos pueden ser aplicables según la situación y las condiciones legales.","🚕 Färdtjänst","Puede ser útil investigar el transporte adaptado si existen dificultades importantes para desplazarse por medios ordinarios.","🏫 Apoyo escolar","Puede ser necesario hablar con la escuela y el municipio sobre las medidas de apoyo que correspondan."]},
sv:{tag:"Hitta rätt stöd för dig och din familj.",home:"Vad behöver du hjälp med?",c:["Jag vet inte vilket stöd jag kan söka","Stöd för mitt barn","Personlig assistans","LSS","Färdtjänst","Skola","Bostad","Jag har fått avslag på stöd"],back:"← Tillbaka",wt:"Berätta lite om din situation",wi:"Svara på frågorna. Du behöver inte känna till namnet på någon insats.",wl:"Vem söker du stöd för?",opts:["Mitt barn","För mig själv","Annan familjemedlem"],al:"Ålder",dl:"Vilka svårigheter finns?",sl:"Berätta med egna ord vad som händer",ph:"Beskriv vardagen och vilket stöd som behövs...",ab:"Se möjliga stöd",mod:"← Ändra svar",rt:"Möjliga stöd att undersöka",pay:"📄 Förbered min personliga ansökan — 9,90 €",note:"Denna vägledning garanterar inte att du har rätt till en insats. Beslut fattas av ansvarig myndighet.",diff:["Autism","Intellektuell funktionsnedsättning","Rörlighet / resor","Behov av tillsyn","Svårigheter i skolan","Behov av personlig hjälp"],res:["♿ Personlig assistans","Det kan vara relevant att undersöka om det finns ett omfattande och varaktigt behov av personlig hjälp.","📋 LSS","Det är bra att kontrollera vilka stödinsatser som kan vara aktuella utifrån situationen och lagens villkor.","🚕 Färdtjänst","Det kan vara relevant att undersöka färdtjänst om det finns betydande svårigheter att resa med vanlig kollektivtrafik.","🏫 Stöd i skolan","Det kan vara bra att kontakta skolan och kommunen om vilka stödåtgärder som kan vara aktuella."]}}
let lang="es";
function setLang(l){lang=l;const t=T[l];document.documentElement.lang=l;document.getElementById("tag").textContent=t.tag;document.getElementById("homeTitle").textContent=t.home;for(let i=1;i<=8;i++)document.getElementById("c"+i).textContent=t.c[i-1];document.getElementById("back").textContent=t.back;document.getElementById("wTitle").textContent=t.wt;document.getElementById("wIntro").textContent=t.wi;document.getElementById("whoLabel").textContent=t.wl;document.getElementById("ageLabel").textContent=t.al;document.getElementById("diffLabel").textContent=t.dl;document.getElementById("storyLabel").textContent=t.sl;document.getElementById("story").placeholder=t.ph;document.getElementById("analyzeBtn").textContent=t.ab;document.getElementById("modify").textContent=t.mod;document.getElementById("rTitle").textContent=t.rt;document.getElementById("payBtn").textContent=t.pay;document.getElementById("note").textContent=t.note;document.getElementById("who").innerHTML=t.opts.map(x=>`<option>${x}</option>`).join("");document.getElementById("checks").innerHTML=t.diff.map((x,i)=>`<label><input type="checkbox" value="${i}"> ${x}</label>`).join("");document.getElementById("sv").className=l==="sv"?"sel":"";document.getElementById("es").className=l==="es"?"sel":""}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");scrollTo(0,0)}
function analyze(){const t=T[lang], checks=[...document.querySelectorAll("#checks input:checked")].map(x=>+x.value);let items=[];if(checks.some(x=>[0,1,3,5].includes(x)))items.push([t.res[0],t.res[1]]);if(checks.includes(0)||checks.includes(1))items.push([t.res[2],t.res[3]]);if(checks.includes(2))items.push([t.res[4],t.res[5]]);if(checks.includes(4))items.push([t.res[6],t.res[7]]);if(!items.length)items=[[lang==="es"?"🔎 Evaluación inicial":"🔎 Inledande bedömning",lang==="es"?"Con más información podremos identificar qué apoyos conviene investigar.":"Med mer information kan vi identifiera vilket stöd som kan vara relevant att undersöka."]];document.getElementById("intro").textContent=lang==="es"?"Según tus respuestas, estas son áreas que podrías investigar:":"Utifrån dina svar är detta stöd som du kan behöva undersöka:";document.getElementById("resultsBox").innerHTML=items.map(i=>`<div class="result"><h3>${i[0]}</h3><div>${i[1]}</div></div>`).join("");show("results")}
document.getElementById("payBtn").onclick=()=>alert(lang==="es"?"El pago se activará en una fase posterior. Por ahora estamos probando la idea gratis.":"Betalningen aktiveras i ett senare steg. Just nu testar vi idén gratis.");
setLang("es");
</script>
</body></html>
